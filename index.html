<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0f1420">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bimaru">
<title>Bimaru</title>
<style>
  :root{
    color-scheme:dark;
    --bg:#0f1420;--panel:#1a2132;--line:rgba(255,255,255,.09);
    --text:#f4f7fb;--muted:#8d99ae;
    --blue:#1c8cff;--blue-deep:#0a5fc4;--sky:#7cc0ff;--green:#5fe3a1;--red:#ff5d6c;--gold:#ffd166;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    min-height:100dvh;display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 10px);
    background:radial-gradient(120% 60% at 50% -10%,#24365c 0,transparent 60%),var(--bg);
    color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none;user-select:none;overscroll-behavior:none;
  }
  button{font:inherit;color:inherit;cursor:pointer;appearance:none;-webkit-appearance:none;border:0;background:none}
  .app{width:100%;max-width:480px;margin:0 auto;padding:0 16px;flex:1;display:flex;flex-direction:column}

  .header{display:flex;align-items:center;justify-content:space-between;padding:12px 0 10px}
  .header__title{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em}
  .header__sub{margin:2px 0 0;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .timer{
    display:flex;align-items:center;gap:7px;padding:9px 13px;border-radius:999px;
    background:var(--panel);border:1px solid var(--line);
    font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;
  }
  .timer svg{width:16px;height:16px;fill:none;stroke:var(--sky);stroke-width:2.2;stroke-linecap:round}

  .levels{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
  .levels__btn{padding:9px 0;border-radius:10px;font-size:13px;font-weight:700;color:var(--muted);transition:background .2s,color .2s}
  .levels__btn[aria-pressed="true"]{background:linear-gradient(180deg,#2b98ff,#0e6fe0);color:#fff;box-shadow:0 4px 14px rgba(28,140,255,.35)}

  .fleet{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 12px;min-height:52px;padding:14px 0}
  .fleet__ship{height:12px;border-radius:99px;background:#39435a;transition:background .25s,box-shadow .25s}
  .fleet__ship.is-done{background:#fff;box-shadow:0 0 10px rgba(255,255,255,.35)}
  .fleet__ship.is-over{background:var(--red)}

  .stage{flex:1}
  .grid{--clue:28px;display:grid;grid-template-columns:minmax(0,1fr) var(--clue);grid-template-rows:auto var(--clue)}
  .board{
    position:relative;display:grid;aspect-ratio:1;overflow:hidden;touch-action:none;
    background:#0b0f18;border:2px solid #eef3fa;border-radius:16px;
    box-shadow:0 18px 40px rgba(0,0,0,.45),0 0 0 6px rgba(255,255,255,.04);
  }
  .board.is-won{animation:won .7s ease}
  @keyframes won{40%{transform:scale(1.025);box-shadow:0 0 0 8px rgba(95,227,161,.35)}}
  .cell{background:#0b0f18;box-shadow:inset -1px -1px 0 rgba(140,165,200,.16);transition:background .12s}
  .cell--water,.cell--ship{background:var(--blue)}
  .cell--given{background:var(--blue-deep)}
  .cell--bad{box-shadow:inset 0 0 0 2px var(--red)}
  .ships{position:absolute;inset:0;pointer-events:none}
  .pill{position:absolute;background:#fff;border-radius:999px;box-shadow:0 2px 5px rgba(0,20,60,.35);animation:pop .16s ease-out}
  @keyframes pop{from{transform:scale(.8);opacity:.5}}

  .clues{display:grid;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
  .clues--rows{padding-left:8px}
  .clues--cols{padding-top:8px}
  .clue{display:flex;align-items:center;justify-content:center;transition:color .2s}
  .clue__count{font-size:9px;font-weight:800;color:var(--sky);align-self:flex-start;margin:-1px 1px 0 0;min-width:6px}
  .clue--full{color:#5b667b}
  .clue--over,.clue--over .clue__count{color:var(--red)}

  .actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:16px 0 4px}
  .action{
    display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 0 9px;border-radius:16px;
    background:var(--panel);border:1px solid var(--line);font-size:11px;font-weight:700;color:#c9d2e2;
    transition:transform .1s,background .1s;
  }
  .action:active{transform:scale(.95);background:#242d42}
  .action svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .action--primary{background:linear-gradient(180deg,#2b98ff,#0e6fe0);border-color:transparent;color:#fff}

  .overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:24px;background:rgba(6,9,15,.72);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  .overlay[hidden]{display:none}
  .card{width:100%;max-width:320px;padding:26px 22px 22px;border-radius:26px;text-align:center;background:linear-gradient(160deg,#243049,#161d2c);border:1px solid rgba(255,255,255,.12);box-shadow:0 30px 70px rgba(0,0,0,.55);animation:rise .3s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes rise{from{transform:translateY(24px) scale(.94);opacity:0}}
  .card__stars{font-size:34px;letter-spacing:6px;color:#39435a}
  .card__stars b{color:var(--gold);font-weight:400;text-shadow:0 0 16px rgba(255,209,102,.5)}
  .card__title{margin:10px 0 4px;font-size:24px;font-weight:800}
  .card__text{margin:0 0 16px;font-size:13px;color:var(--muted)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
  .stat{padding:10px 4px;border-radius:14px;background:rgba(255,255,255,.05)}
  .stat__value{display:block;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
  .stat__label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .cta{width:100%;padding:15px;border-radius:16px;font-size:16px;font-weight:800;color:#fff;background:linear-gradient(180deg,#2b98ff,#0e6fe0);box-shadow:0 8px 22px rgba(28,140,255,.4)}
  .cta:active{transform:scale(.98)}
  .link{margin-top:10px;padding:8px;font-size:13px;color:var(--muted)}
  .spinner{width:40px;height:40px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:var(--blue);animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (max-height:700px){.fleet{padding:9px 0;min-height:40px}.actions{padding-top:10px}.header{padding:8px 0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div>
      <h1 class="header__title">Bimaru</h1>
      <p class="header__sub" id="sub">Rätsel 1</p>
    </div>
    <div class="timer" aria-label="Spielzeit">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span id="time">00:00</span>
    </div>
  </header>

  <div class="levels" id="levels" role="group" aria-label="Schwierigkeit">
    <button class="levels__btn" type="button" data-key="easy">Leicht</button>
    <button class="levels__btn" type="button" data-key="medium">Mittel</button>
    <button class="levels__btn" type="button" data-key="hard">Schwer</button>
  </div>

  <div class="fleet" id="fleet" aria-label="Flotte"></div>

  <main class="stage">
    <div class="grid">
      <div class="board" id="board" aria-label="Spielfeld"></div>
      <div class="clues clues--rows" id="rowClues"></div>
      <div class="clues clues--cols" id="colClues"></div>
    </div>
  </main>

  <nav class="actions" aria-label="Aktionen">
    <button class="action" id="undo" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7 4 12l5 5"/><path d="M4 12h10a5 5 0 0 1 0 10h-2"/></svg>Zurück
    </button>
    <button class="action" id="hint" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg>Tipp
    </button>
    <button class="action" id="clear" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>Leeren
    </button>
    <button class="action action--primary" id="new" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Neu
    </button>
  </nav>
</div>

<div class="overlay" id="win" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="winTitle">
    <div class="card__stars" id="stars" aria-hidden="true"></div>
    <h2 class="card__title" id="winTitle">Gelöst!</h2>
    <p class="card__text" id="winText"></p>
    <div class="stats">
      <div class="stat"><span class="stat__value" id="statTime">00:00</span><span class="stat__label">Zeit</span></div>
      <div class="stat"><span class="stat__value" id="statBest">00:00</span><span class="stat__label">Bestzeit</span></div>
      <div class="stat"><span class="stat__value" id="statWins">0</span><span class="stat__label">Gelöst</span></div>
    </div>
    <button class="cta" id="next" type="button">Nächstes Rätsel</button>
    <button class="link" id="closeWin" type="button">Brett ansehen</button>
  </div>
</div>

<div class="overlay" id="loader" hidden><div class="spinner" role="status" aria-label="Rätsel wird erstellt"></div></div>

<script>
(function () {
  'use strict';

  /* ===== ENGINE ===== */
  var LEVELS = {
    easy:   { label: 'Leicht', n: 8,  ships: [3, 2, 2, 1, 1, 1], tries: 4 },
    medium: { label: 'Mittel', n: 9,  ships: [4, 3, 2, 2, 1, 1, 1], tries: 2, extra: 3 },
    hard:   { label: 'Schwer', n: 10, ships: [4, 3, 3, 2, 2, 2, 1, 1, 1, 1], tries: 3 }
  };
  var CAP = 150000;

  function rnd(n) { return Math.floor(Math.random() * n); }
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) { var j = rnd(i + 1), t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  /* Zufällige Flotte, Schiffe berühren sich nie (auch nicht diagonal) */
  function makeSolution(n, ships) {
    for (var attempt = 0; attempt < 300; attempt++) {
      var g = new Uint8Array(n * n), ok = true;
      for (var s = 0; s < ships.length && ok; s++) {
        var len = ships[s], placed = false;
        for (var t = 0; t < 300 && !placed; t++) {
          var h = Math.random() < 0.5, r = rnd(h ? n : n - len + 1), c = rnd(h ? n - len + 1 : n), free = true, k, y, x;
          for (k = 0; k < len && free; k++) {
            var rr = h ? r : r + k, cc = h ? c + k : c;
            for (y = rr - 1; y <= rr + 1 && free; y++) for (x = cc - 1; x <= cc + 1; x++) {
              if (y >= 0 && x >= 0 && y < n && x < n && g[y * n + x]) { free = false; break; }
            }
          }
          if (free) { for (k = 0; k < len; k++) g[h ? r * n + c + k : (r + k) * n + c] = 1; placed = true; }
        }
        ok = placed;
      }
      if (ok) return g;
    }
    return null;
  }

  /* Vollständiger Löser: liefert bis zu `limit` Lösungen. fixed: 1 = Schiff, 2 = Wasser */
  function solve(n, fleet, rows, cols, fixed, limit, cap) {
    var N = n * n, g = new Uint8Array(N), rl = rows.slice(), cl = cols.slice();
    var need = [], max = 0, st = [], sols = [], nodes = 0, aborted = false, i;
    for (i = 0; i < fleet.length; i++) { need[fleet[i]] = (need[fleet[i]] || 0) + 1; if (fleet[i] > max) max = fleet[i]; }

    function take(len) { if (!need[len]) return false; need[len]--; st.push(len); return true; }
    function undo(m) { while (st.length > m) need[st.pop()]++; }
    function runLeft(i, c) { var L = 0; while (c >= 0 && g[i]) { L++; i--; c--; } return L; }
    function runUp(i) { var L = 0; while (i >= 0 && g[i]) { L++; i -= n; } return L; }
    function closeVertical(i, c) {
      var L = runUp(i);
      if (L > 1) return take(L);
      if ((c > 0 && g[i - 1]) || (c < n - 1 && g[i + 1])) return true;
      return take(1);
    }
    function rec(i) {
      if (aborted || sols.length >= limit) return;
      if (++nodes > cap) { aborted = true; return; }
      var m = st.length, ok = true, c, L;
      if (i === N) {
        for (c = 0; c < n && ok; c++) if (g[N - n + c]) ok = closeVertical(N - n + c, c);
        if (ok) sols.push(g.slice());
        undo(m);
        return;
      }
      var r = (i / n) | 0;
      c = i % n;
      if (fixed[i] !== 2 && rl[r] > 0 && cl[c] > 0 &&
          !(r > 0 && ((c > 0 && g[i - n - 1]) || (c < n - 1 && g[i - n + 1])))) {
        g[i] = 1; rl[r]--; cl[c]--;
        ok = runUp(i) <= max;
        if (ok) { L = runLeft(i, c); ok = L <= max && (c < n - 1 || L < 2 || take(L)); }
        if (ok) rec(i + 1);
        undo(m); g[i] = 0; rl[r]++; cl[c]++;
      }
      if (fixed[i] !== 1 && rl[r] <= n - 1 - c && cl[c] <= n - 1 - r) {
        ok = true;
        if (c > 0 && g[i - 1]) { L = runLeft(i - 1, c - 1); if (L > 1) ok = take(L); }
        if (ok && r > 0 && g[i - n]) ok = closeVertical(i - n, c);
        if (ok) rec(i + 1);
        undo(m);
      }
    }
    rec(0);
    return { sols: sols, aborted: aborted };
  }

  /* Einfache Schlussregeln (für "Leicht"): volle/erzwungene Linien, Diagonalen = Wasser */
  function propagate(n, rows, cols, fixed) {
    var k = fixed.slice(), changed = true, i, r, c, line, s, u, j;
    while (changed) {
      changed = false;
      for (i = 0; i < n * n; i++) {
        if (k[i] !== 1) continue;
        r = (i / n) | 0; c = i % n;
        for (j = 0; j < 4; j++) {
          var y = r + (j < 2 ? -1 : 1), x = c + (j % 2 ? 1 : -1);
          if (y >= 0 && x >= 0 && y < n && x < n && !k[y * n + x]) { k[y * n + x] = 2; changed = true; }
        }
      }
      for (line = 0; line < 2 * n; line++) {
        var isRow = line < n, idx = isRow ? line : line - n, sum = isRow ? rows[idx] : cols[idx];
        s = 0; u = 0;
        for (j = 0; j < n; j++) { i = isRow ? idx * n + j : j * n + idx; if (k[i] === 1) s++; else if (!k[i]) u++; }
        if (!u || (s !== sum && s + u !== sum)) continue;
        for (j = 0; j < n; j++) { i = isRow ? idx * n + j : j * n + idx; if (!k[i]) k[i] = s === sum ? 2 : 1; }
        changed = true;
      }
    }
    return k;
  }

  /* Erzeugt ein Rätsel mit bewiesen genau einer Lösung */
  function generate(key) {
    var cfg = LEVELS[key], n = cfg.n, N = n * n, best = null, i;
    for (var t = 0; t < cfg.tries || !best; t++) {
      var sol = makeSolution(n, cfg.ships);
      if (!sol) continue;
      var rows = [], cols = [], fixed = new Uint8Array(N), pick, res;
      for (i = 0; i < n; i++) { rows.push(0); cols.push(0); }
      for (i = 0; i < N; i++) if (sol[i]) { rows[(i / n) | 0]++; cols[i % n]++; }

      /* 1. Vorgaben ergänzen, bis nur noch eine Lösung existiert */
      for (;;) {
        res = solve(n, cfg.ships, rows, cols, fixed, 2, CAP);
        if (!res.aborted && res.sols.length === 1) break;
        pick = [];
        if (!res.aborted) {
          var other = res.sols[0];
          for (i = 0; i < N; i++) if (other[i] !== sol[i]) break;
          if (i === N) other = res.sols[1];
          for (i = 0; i < N; i++) if (sol[i] && !other[i]) pick.push(i);
        }
        if (!pick.length) for (i = 0; i < N; i++) if (sol[i] && !fixed[i]) pick.push(i);
        fixed[pick[rnd(pick.length)]] = 1;
      }

      /* 2. Überflüssige Vorgaben wieder entfernen */
      var given = [];
      for (i = 0; i < N; i++) if (fixed[i]) given.push(i);
      shuffle(given);
      for (i = 0; i < given.length; i++) {
        fixed[given[i]] = 0;
        res = solve(n, cfg.ships, rows, cols, fixed, 2, CAP);
        if (res.aborted || res.sols.length !== 1) fixed[given[i]] = 1;
      }

      /* 3. Stufe anpassen */
      if (key === 'medium') {
        pick = [];
        for (i = 0; i < N; i++) if (sol[i] && !fixed[i]) pick.push(i);
        shuffle(pick);
        for (i = 0; i < cfg.extra && i < pick.length; i++) fixed[pick[i]] = 1;
      } else if (key === 'easy') {
        for (;;) {
          var known = propagate(n, rows, cols, fixed);
          pick = [];
          for (i = 0; i < N; i++) if (!known[i] && sol[i]) pick.push(i);
          if (!pick.length) break;
          fixed[pick[rnd(pick.length)]] = 1;
        }
      }

      var count = 0;
      for (i = 0; i < N; i++) if (fixed[i]) count++;
      if (!best || count < best.count) {
        best = { key: key, n: n, ships: cfg.ships.slice(), sol: sol, rows: rows, cols: cols, fixed: fixed, count: count };
      }
    }
    return best;
  }
  /* ===== /ENGINE ===== */

  /* ===== SPIEL ===== */
  /* Zellzustand: 0 = leer (schwarz), 2 = Wasser, 1 = Schiff. Tippen: 0 -> 2 -> 1 -> 0 */
  var NEXT = { 0: 2, 2: 1, 1: 0 };
  var SAVE_KEY = 'bimaru.game.v9', STATS_KEY = 'bimaru.stats.v1';
  var $ = function (id) { return document.getElementById(id); };
  var board = $('board'), fleetEl = $('fleet'), loader = $('loader'), win = $('win');
  var S = null, cells = [], rowEls = [], colEls = [], shipLayer = null;
  var undoStack = [], pending = null, drag = null, ticker = null, cache = {};
  var stats = readJSON(STATS_KEY) || {};

  function readJSON(key) { try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; } }
  function writeJSON(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} }
  function fmt(s) { return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
  function make(tag, cls, parent) { var el = document.createElement(tag); el.className = cls; parent.appendChild(el); return el; }

  function save() {
    if (!S) return;
    writeJSON(SAVE_KEY, {
      key: S.key, n: S.n, ships: S.ships, rows: S.rows, cols: S.cols, level: S.level,
      sol: Array.from(S.sol), fixed: Array.from(S.fixed), user: Array.from(S.user),
      elapsed: S.elapsed, hints: S.hints, done: S.done
    });
  }

  function load() {
    var d = readJSON(SAVE_KEY);
    if (!d || !LEVELS[d.key] || d.n !== LEVELS[d.key].n) return false;
    var N = d.n * d.n, ok = ['sol', 'fixed', 'user'].every(function (k) { return Array.isArray(d[k]) && d[k].length === N; });
    if (!ok || !Array.isArray(d.rows) || !Array.isArray(d.cols) || !Array.isArray(d.ships)) return false;
    S = d;
    S.sol = Uint8Array.from(d.sol); S.fixed = Uint8Array.from(d.fixed); S.user = Uint8Array.from(d.user);
    S.elapsed = d.elapsed | 0; S.hints = d.hints | 0; S.level = d.level || 1; S.done = !!d.done;
    undoStack = [];
    build(); render();
    return true;
  }

  function precompute(key) {
    setTimeout(function () { if (!cache[key]) cache[key] = generate(key); }, 800);
  }

  function newGame(key, level) {
    function start(p) {
      p.user = p.fixed.slice(); p.level = level; p.elapsed = 0; p.hints = 0; p.done = false;
      S = p; undoStack = []; pending = drag = null;
      win.hidden = true; loader.hidden = true;
      build(); render(); save(); precompute(key);
    }
    if (cache[key]) { var p = cache[key]; cache[key] = null; start(p); return; }
    loader.hidden = false;
    requestAnimationFrame(function () { setTimeout(function () { start(generate(key)); }, 30); });
  }

  function build() {
    var n = S.n, i;
    board.textContent = ''; $('rowClues').textContent = ''; $('colClues').textContent = '';
    board.classList.remove('is-won');
    board.style.gridTemplate = 'repeat(' + n + ',1fr) / repeat(' + n + ',1fr)';
    $('rowClues').style.gridTemplateRows = $('colClues').style.gridTemplateColumns = 'repeat(' + n + ',1fr)';
    cells = []; rowEls = []; colEls = [];
    for (i = 0; i < n * n; i++) { cells.push(make('div', 'cell', board)); cells[i].dataset.i = i; }
    shipLayer = make('div', 'ships', board);
    for (i = 0; i < 2 * n; i++) {
      var clue = make('div', 'clue', $(i < n ? 'rowClues' : 'colClues'));
      clue.count = make('span', 'clue__count', clue);
      clue.sum = make('span', '', clue);
      clue.sum.textContent = i < n ? S.rows[i] : S.cols[i - n];
      (i < n ? rowEls : colEls).push(clue);
    }
    Array.prototype.forEach.call($('levels').children, function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.key === S.key));
    });
    $('sub').textContent = LEVELS[S.key].label + ' · Rätsel ' + S.level;
    $('time').textContent = fmt(S.elapsed);
  }

  /* Zusammenhängende Schiffsteile (waagrecht/senkrecht verbunden) */
  function components() {
    var n = S.n, seen = new Uint8Array(n * n), out = [], i;
    for (i = 0; i < n * n; i++) {
      if (S.user[i] !== 1 || seen[i]) continue;
      var stack = [i], list = [];
      seen[i] = 1;
      while (stack.length) {
        var j = stack.pop(), c = j % n;
        list.push(j);
        [j - n, j + n, c > 0 ? j - 1 : -1, c < n - 1 ? j + 1 : -1].forEach(function (q) {
          if (q >= 0 && q < n * n && S.user[q] === 1 && !seen[q]) { seen[q] = 1; stack.push(q); }
        });
      }
      list.sort(function (a, b) { return a - b; });
      var first = list[0], last = list[list.length - 1];
      out.push({ cells: list, straight: last - first === list.length - 1 || last - first === (list.length - 1) * n });
    }
    return out;
  }

  function render() {
    var n = S.n, u = S.user, comps = components(), bad = new Uint8Array(n * n), i, r, c, html = '';
    var max = Math.max.apply(null, S.ships), need = {}, have = {};

    for (i = 0; i < n * n; i++) {
      if (u[i] !== 1 || i + n >= n * n) continue;
      c = i % n;
      if (c > 0 && u[i + n - 1] === 1) bad[i] = bad[i + n - 1] = 1;
      if (c < n - 1 && u[i + n + 1] === 1) bad[i] = bad[i + n + 1] = 1;
    }
    comps.forEach(function (comp) {
      var len = comp.cells.length, a = comp.cells[0], pad = 0.07, w = 1, h = 1;
      if (len > max) comp.cells.forEach(function (q) { bad[q] = 1; });
      if (comp.straight) {
        have[len] = (have[len] || 0) + 1;
        if (len > 1 && comp.cells[1] - a === 1) w = len; else h = len;
        html += pill(a, w, h, pad);
      } else comp.cells.forEach(function (q) { html += pill(q, 1, 1, pad); });
    });
    function pill(idx, w, h, pad) {
      return '<i class="pill" style="left:' + ((idx % n + pad) / n * 100) + '%;top:' + ((((idx / n) | 0) + pad) / n * 100) +
        '%;width:' + ((w - 2 * pad) / n * 100) + '%;height:' + ((h - 2 * pad) / n * 100) + '%"></i>';
    }
    if (shipLayer.dataset.sig !== html) { shipLayer.innerHTML = html; shipLayer.dataset.sig = html; }

    for (i = 0; i < n * n; i++) {
      cells[i].className = 'cell' + (S.fixed[i] ? ' cell--given' : u[i] ? ' cell--water' : '') + (bad[i] ? ' cell--bad' : '');
    }

    /* Hochzahl = aktuell gesetzte Schiffsfelder der Linie: blau, rot bei Überschreitung */
    for (i = 0; i < 2 * n; i++) {
      var count = 0, isRow = i < n, sum = isRow ? S.rows[i] : S.cols[i - n], el = isRow ? rowEls[i] : colEls[i - n];
      for (r = 0; r < n; r++) if (u[isRow ? i * n + r : r * n + i - n] === 1) count++;
      el.count.textContent = count || '';
      el.className = 'clue' + (count > sum ? ' clue--over' : '');
    }

    S.ships.forEach(function (len) { need[len] = (need[len] || 0) + 1; });
    html = '';
    Object.keys(need).map(Number).sort(function (a, b) { return b - a; }).forEach(function (len) {
      for (var q = 0; q < need[len]; q++) {
        var cls = (have[len] || 0) > need[len] ? ' is-over' : q < (have[len] || 0) ? ' is-done' : '';
        html += '<span class="fleet__ship' + cls + '" style="width:' + len * 12 + 'px"></span>';
      }
    });
    fleetEl.innerHTML = html;

    if (!S.done && isSolved()) finish();
  }

  /* Das Rätsel hat genau eine Lösung, daher genügt der Vergleich der Schiffsfelder */
  function isSolved() {
    for (var i = 0; i < S.sol.length; i++) if ((S.user[i] === 1) !== (S.sol[i] === 1)) return false;
    return true;
  }

  function finish() {
    S.done = true;
    var st = stats[S.key] || (stats[S.key] = { wins: 0, best: 0 });
    st.wins++;
    var record = !S.hints && (!st.best || S.elapsed < st.best);
    if (record) st.best = S.elapsed;
    writeJSON(STATS_KEY, stats); save();
    var stars = S.hints === 0 ? 3 : S.hints <= 2 ? 2 : 1;
    $('stars').innerHTML = '<b>' + '★'.repeat(stars) + '</b>' + '★'.repeat(3 - stars);
    $('winTitle').textContent = record ? 'Neue Bestzeit!' : 'Gelöst!';
    $('winText').textContent = LEVELS[S.key].label + ' · Rätsel ' + S.level + (S.hints ? ' · ' + S.hints + ' Tipp' + (S.hints > 1 ? 's' : '') : ' · ohne Tipps');
    $('statTime').textContent = fmt(S.elapsed);
    $('statBest').textContent = st.best ? fmt(st.best) : '–';
    $('statWins').textContent = st.wins;
    board.classList.add('is-won');
    setTimeout(function () { if (S.done) win.hidden = false; }, 650);
  }

  /* ----- Eingabe ----- */
  function setCell(i, v) {
    if (S.fixed[i] || S.user[i] === v) return false;
    pending.push([i, S.user[i]]);
    S.user[i] = v;
    return true;
  }
  function commit() {
    if (pending && pending.length) { undoStack.push(pending); if (undoStack.length > 200) undoStack.shift(); save(); }
    pending = null;
  }
  function cellAt(x, y) {
    var b = board.getBoundingClientRect(), n = S.n;
    var c = Math.floor((x - b.left) / b.width * n), r = Math.floor((y - b.top) / b.height * n);
    return r < 0 || c < 0 || r >= n || c >= n ? -1 : r * n + c;
  }

  board.addEventListener('pointerdown', function (e) {
    if (!S || S.done || drag) return;
    var i = cellAt(e.clientX, e.clientY);
    if (i < 0 || S.fixed[i]) return;
    e.preventDefault();
    pending = [];
    drag = { id: e.pointerId, start: i, value: NEXT[S.user[i]], moved: false };
    try { board.setPointerCapture(e.pointerId); } catch (err) {}
  });
  board.addEventListener('pointermove', function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    var i = cellAt(e.clientX, e.clientY);
    if (i < 0 || (!drag.moved && i === drag.start)) return;
    var changed = !drag.moved && setCell(drag.start, drag.value);
    drag.moved = true;
    if (setCell(i, drag.value) || changed) render();
  });
  function endDrag(e) {
    if (!drag || e.pointerId !== drag.id) return;
    if (!drag.moved) setCell(drag.start, drag.value);
    drag = null;
    commit(); render();
  }
  board.addEventListener('pointerup', endDrag);
  board.addEventListener('pointercancel', endDrag);

  $('undo').addEventListener('click', function () {
    var last = undoStack.pop();
    if (!last || S.done) return;
    for (var i = last.length - 1; i >= 0; i--) S.user[last[i][0]] = last[i][1];
    save(); render();
  });

  $('clear').addEventListener('click', function () {
    if (S.done) return;
    pending = [];
    for (var i = 0; i < S.user.length; i++) setCell(i, 0);
    commit(); render();
  });

  /* Tipp: korrigiert zuerst einen Fehler, sonst wird ein fehlendes Schiffsfeld aufgedeckt */
  $('hint').addEventListener('click', function () {
    if (S.done) return;
    var wrong = [], missing = [], i;
    for (i = 0; i < S.sol.length; i++) {
      if (S.user[i] === 1 && !S.sol[i]) wrong.push(i);
      else if (S.user[i] === 2 && S.sol[i]) wrong.push(i);
      else if (S.user[i] !== 1 && S.sol[i]) missing.push(i);
    }
    var list = wrong.length ? wrong : missing;
    if (!list.length) return;
    i = list[rnd(list.length)];
    pending = [];
    setCell(i, S.sol[i] ? 1 : 2);
    commit();
    undoStack = [];           /* aufgedeckte Felder lassen sich nicht zurücknehmen */
    S.fixed[i] = S.sol[i] ? 1 : 2;
    S.hints++;
    save(); render();
  });

  function hasProgress() { return S && !S.done && undoStack.length > 0; }
  $('new').addEventListener('click', function () {
    if (hasProgress() && !confirm('Aktuelles Rätsel verwerfen?')) return;
    newGame(S.key, S.level);
  });
  $('levels').addEventListener('click', function (e) {
    var btn = e.target.closest('.levels__btn');
    if (!btn || btn.dataset.key === S.key) return;
    if (hasProgress() && !confirm('Aktuelles Rätsel verwerfen?')) return;
    newGame(btn.dataset.key, (stats[btn.dataset.key] ? stats[btn.dataset.key].wins : 0) + 1);
  });
  $('next').addEventListener('click', function () { newGame(S.key, S.level + 1); });
  $('closeWin').addEventListener('click', function () { win.hidden = true; });

  /* Timer läuft nur, wenn die App sichtbar und das Rätsel offen ist */
  ticker = setInterval(function () {
    if (!S || S.done || document.hidden || !loader.hidden) return;
    S.elapsed++;
    $('time').textContent = fmt(S.elapsed);
    if (S.elapsed % 5 === 0) save();
  }, 1000);
  document.addEventListener('visibilitychange', function () { if (document.hidden) save(); });

  if (load()) precompute(S.key); else newGame('medium', 1);
})();
</script>
</body>
</html>

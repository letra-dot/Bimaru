<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#2b2b2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bimaru">
<title>Bimaru</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;height:100%}
  body{
    background:#2b2b2b;color:#e9e9e9;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none;user-select:none;
    display:flex;flex-direction:column;min-height:100dvh;
    padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 6px)
  }
  .app{width:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;flex:1;padding:0 14px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 2px 4px}
  .timer{display:flex;align-items:center;gap:8px;font-size:20px;font-variant-numeric:tabular-nums;color:#ddd}
  .timer svg{width:19px;height:19px;fill:none;stroke:#c8c8c8;stroke-width:1.9;stroke-linecap:round}
  .top__actions{display:flex;align-items:center;gap:10px}
  .select{appearance:none;background:#333;color:#ddd;border:1px solid #4a4a4a;border-radius:9px;font:inherit;font-size:14px;padding:7px 8px}
  .ghost{appearance:none;border:0;background:none;color:#ddd;font:inherit;font-size:16px;padding:6px 2px}
  .fleet{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:7px 14px;padding:10px 0 14px;--u:12px;min-height:48px}
  .shape{height:var(--u);border-radius:99px;background:#4a4a4a}
  .shape.is-done{background:#fff}
  .stage{flex:1;display:flex;align-items:flex-start}
  .gridwrap{--cl:26px;width:100%;display:grid;grid-template-columns:1fr var(--cl);grid-template-rows:auto var(--cl)}
  .board{position:relative;width:100%;aspect-ratio:1;display:grid;background:#191919;border:2px solid #f2f2f2;border-radius:14px;overflow:hidden;touch-action:none}
  .cell{background:#191919;box-shadow:inset 0 -1px 0 rgba(255,255,255,.08),inset -1px 0 0 rgba(255,255,255,.08)}
  .cell--water,.cell--ship{background:#0a76dd}
  .cell--bad{z-index:3;border-radius:8px;outline:2px solid #ff5252;outline-offset:-2px}
  .ships{position:absolute;inset:0;pointer-events:none}
  .pill{position:absolute;background:#fff;border-radius:99px}
  .pill--bad{border-radius:50%;outline:2px solid #ff5252;outline-offset:-1px}
  .clues{display:grid;color:#d0d0d0;font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
  .clues--right{grid-template-columns:1fr;justify-items:center;padding-left:9px}
  .clues--bottom{grid-template-rows:1fr;justify-items:center;align-items:center;padding-top:8px}
  .clue{display:grid;place-items:center;width:100%;height:100%}
  .clue__text{white-space:nowrap}
  .clue__count{font-style:normal;font-size:9px;font-weight:700;vertical-align:super;color:#7fb2ff;margin-right:1px}
  .clue.is-over,.clue.is-over .clue__count{color:#ff5252}
  .actions{display:flex;align-items:center;justify-content:center;gap:12px;padding:16px 0 6px}
  .btn{appearance:none;height:54px;padding:0 15px;border-radius:13px;border:1px solid #4a4a4a;background:#303030;color:#cfcfcf;font:inherit;font-size:15px}
  .btn:active{background:#3a3a3a}
  .undo{width:56%;display:flex;align-items:center;justify-content:center;color:#9e9e9e}
  .undo svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .modal,.loader{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:24px;background:rgba(0,0,0,.65)}
  .modal[hidden],.loader[hidden]{display:none}
  .modal__card{width:100%;max-width:300px;background:#333;border:1px solid #4a4a4a;border-radius:20px;padding:22px;text-align:center}
  .modal__kicker{margin:0 0 4px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#5ee08a}
  .modal__title{margin:0 0 6px;font-size:20px}
  .modal__time{margin:0 0 16px;font-size:14px;color:#aaa;font-variant-numeric:tabular-nums}
  .modal .btn{width:100%;margin-top:8px;background:#0a76dd;border-color:#0a76dd;color:#fff}
  .loader{z-index:40;background:rgba(24,24,24,.86);backdrop-filter:blur(3px)}
  .loader__card{display:flex;flex-direction:column;align-items:center;gap:14px;color:#ccc;font-size:14px}
  .spinner{width:36px;height:36px;border-radius:50%;border:3px solid #4a4a4a;border-top-color:#0a76dd;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="timer">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span id="time">00:00</span>
    </div>
    <div class="top__actions">
      <select id="difficulty" class="select" aria-label="Schwierigkeit">
        <option value="easy">Leicht · 8×8</option>
        <option value="medium" selected>Mittel · 9×9</option>
        <option value="hard">Schwer · 10×10</option>
      </select>
      <button id="showSolution" class="ghost" type="button">Ergebnis</button>
    </div>
  </header>

  <div class="fleet" id="fleet" aria-label="Flotte"></div>

  <main class="stage">
    <div class="gridwrap">
      <div class="board" id="board" aria-label="Spielfeld"></div>
      <div class="clues clues--right" id="rowClues"></div>
      <div class="clues clues--bottom" id="colClues"></div>
    </div>
  </main>

  <div class="actions">
    <button class="btn" id="clear" type="button">Leeren</button>
    <button class="btn undo" id="undo" type="button" aria-label="Zug zurück">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7 4 12l5 5"/><path d="M4 12h9a5 5 0 0 1 0 10h-2"/></svg>
    </button>
    <button class="btn" id="newGame" type="button">Neu</button>
  </div>
</div>

<div class="modal" id="winModal" hidden>
  <div class="modal__card">
    <p class="modal__kicker">Geschafft</p>
    <h2 class="modal__title" id="winTitle">Rätsel gelöst</h2>
    <p class="modal__time" id="winTime"></p>
    <button class="btn" id="nextGame" type="button">Nächstes Rätsel</button>
    <button class="btn" id="closeWin" type="button">Brett ansehen</button>
  </div>
</div>

<div class="loader" id="loader" hidden>
  <div class="loader__card"><div class="spinner"></div><span>Rätsel wird geprüft …</span></div>
</div>

<script>
(function(){
  'use strict';

  /* 0 = schwarz, 2 = Wasser, 1 = Schiff. Tippen: schwarz → Wasser → Schiff → schwarz */
  var NEXT={0:2,2:1,1:0};
  var DIFF={
    easy:{n:8,ships:[3,2,2,1,1,1],extra:5},
    medium:{n:9,ships:[4,3,2,2,1,1,1],extra:2},
    hard:{n:10,ships:[4,3,3,2,2,2,1,1,1,1],extra:0}
  };
  var STORAGE='bimaru.v8';
  var CHUNK_MS=80;
  var GEN_MS=6500;
  var PREGEN_DELAY=500;

  var $=function(id){return document.getElementById(id);};
  var board=$('board'),fleet=$('fleet'),rowClues=$('rowClues'),colClues=$('colClues');
  var difficulty=$('difficulty'),loader=$('loader'),winModal=$('winModal');
  var S=null, cells=[], rowEls=[], colEls=[], shipLayer=null;
  var history=[],pending=null,drag=null;
  var timerId=null,startAt=0,elapsed=0,loading=false;
  var cache={easy:null,medium:null,hard:null},jobs={easy:null,medium:null,hard:null};
  var placementCache={};

  function rnd(n){return Math.floor(Math.random()*n);}
  function shuffle(a){
    for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t;}
    return a;
  }
  function timeText(s){
    var m=Math.floor(s/60),r=s%60;
    return (m<10?'0':'')+m+':'+(r<10?'0':'')+r;
  }
  function startTimer(){
    stopTimer();startAt=Date.now();elapsed=0;$('time').textContent='00:00';
    timerId=setInterval(function(){
      elapsed=Math.floor((Date.now()-startAt)/1000);
      $('time').textContent=timeText(elapsed);
    },500);
  }
  function stopTimer(){if(timerId){clearInterval(timerId);timerId=null;}}
  function setLoading(v){loading=v;loader.hidden=!v;}

  function fits(grid,n,list){
    var own={};
    for(var i=0;i<list.length;i++)own[list[i]]=1;
    for(var k=0;k<list.length;k++){
      var idx=list[k],r=(idx/n)|0,c=idx%n;
      for(var dr=-1;dr<=1;dr++)for(var dc=-1;dc<=1;dc++){
        var rr=r+dr,cc=c+dc;
        if(rr<0||cc<0||rr>=n||cc>=n)continue;
        var j=rr*n+cc;
        if(own[j])continue;
        if(grid[j])return false;
      }
    }
    return true;
  }

  function makeSolution(n,ships){
    var order=ships.slice().sort(function(a,b){return b-a;});
    for(var attempt=0;attempt<500;attempt++){
      var grid=new Uint8Array(n*n),ok=true;
      for(var i=0;i<order.length&&ok;i++){
        var len=order[i],placed=false;
        for(var t=0;t<500;t++){
          var horiz=Math.random()<.5,r,c,list=[];
          if(horiz){r=rnd(n);c=rnd(n-len+1);}
          else{r=rnd(n-len+1);c=rnd(n);}
          for(var k=0;k<len;k++)list.push(horiz?r*n+c+k:(r+k)*n+c);
          if(fits(grid,n,list)){
            for(k=0;k<list.length;k++)grid[list[k]]=1;
            placed=true;break;
          }
        }
        if(!placed)ok=false;
      }
      if(ok)return grid;
    }
    return null;
  }

  function sumsOf(grid,n){
    var row=Array(n).fill(0),col=Array(n).fill(0);
    for(var i=0;i<n*n;i++)if(grid[i]){row[(i/n)|0]++;col[i%n]++;}
    return {row:row,col:col};
  }

  function placements(n,len){
    var key=n+':'+len;
    if(placementCache[key])return placementCache[key];
    var out=[],r,c,k,list;
    for(r=0;r<n;r++)for(c=0;c+len<=n;c++){
      list=[];for(k=0;k<len;k++)list.push(r*n+c+k);out.push(list);
    }
    if(len>1)for(c=0;c<n;c++)for(r=0;r+len<=n;r++){
      list=[];for(k=0;k<len;k++)list.push((r+k)*n+c);out.push(list);
    }
    placementCache[key]=out;
    return out;
  }

  /*
    Zählt gültige Lösungen bis zum Limit.
    mustShip enthält zwingende Schiffsfelder, mustWater zwingende Wasserfelder.
    aborted bedeutet: Zeitbudget verbraucht, also keine Aussage über Eindeutigkeit.
  */
  function countSolutions(n,ships,rowSum,colSum,mustShip,mustWater,limit,budget){
    mustShip=mustShip||{};mustWater=mustWater||{};
    var lens=ships.slice().sort(function(a,b){return b-a;}),byLen={};
    for(var i=0;i<lens.length;i++)byLen[lens[i]]=placements(n,lens[i]);

    var occ=new Uint8Array(n*n),rowLeft=rowSum.slice(),colLeft=colSum.slice();
    var req=[],reqMap={};
    for(var k in mustShip)if(mustShip[k]){var x=Number(k);req.push(x);reqMap[x]=1;}
    for(k in mustWater)if(mustWater[k]&&reqMap[k])return {count:0,aborted:false};

    var count=0,nodes=0,aborted=false,deadline=Date.now()+budget;
    var rUse=new Int16Array(n),cUse=new Int16Array(n);

    function feasible(){
      if((nodes&127)===0&&Date.now()>deadline){aborted=true;return false;}
      var freeR=new Int16Array(n),freeC=new Int16Array(n);
      for(var r=0;r<n;r++)for(var c=0;c<n;c++)if(occ[r*n+c]===0){freeR[r]++;freeC[c]++;}
      var leftTotal=0;
      for(var q=0;q<n;q++){
        if(rowLeft[q]<0||colLeft[q]<0||freeR[q]<rowLeft[q]||freeC[q]<colLeft[q])return false;
        leftTotal+=rowLeft[q];
      }
      var remain=0;
      for(var z=0;z<lens.length;z++)remain+=lens[z];
      return leftTotal===remain;
    }

    function dfs(i,start){
      if(aborted||count>=limit)return;
      nodes++;
      if(i===lens.length){
        for(var q=0;q<n;q++)if(rowLeft[q]!==0||colLeft[q]!==0)return;
        for(var g=0;g<req.length;g++)if(occ[req[g]]!==1)return;
        count++;return;
      }
      if(!feasible())return;

      var len=lens[i],list=byLen[len];
      var first=(i>0&&lens[i]===lens[i-1])?start:0;
      for(var p=first;p<list.length;p++){
        var shape=list[p],ok=true;
        rUse.fill(0);cUse.fill(0);
        for(var a=0;a<shape.length;a++){
          var idx=shape[a];
          if(occ[idx]!==0||mustWater[idx]){ok=false;break;}
          rUse[(idx/n)|0]++;cUse[idx%n]++;
        }
        if(!ok)continue;
        for(a=0;a<n;a++)if(rUse[a]>rowLeft[a]||cUse[a]>colLeft[a]){ok=false;break;}
        if(!ok)continue;

        /* Nie darf ein festes Schiffsfeld durch Nachbarschaft blockiert werden. */
        var own={};for(a=0;a<shape.length;a++)own[shape[a]]=1;
        for(a=0;a<shape.length&&ok;a++){
          var rr=(shape[a]/n)|0,cc=shape[a]%n;
          for(var dr=-1;dr<=1&&ok;dr++)for(var dc=-1;dc<=1;dc++){
            var nr=rr+dr,nc=cc+dc;
            if(nr<0||nc<0||nr>=n||nc>=n)continue;
            var ni=nr*n+nc;
            if(reqMap[ni]&&!own[ni]){ok=false;break;}
          }
        }
        if(!ok)continue;

        var changes=[];
        for(a=0;a<shape.length;a++){
          idx=shape[a];changes.push([idx,occ[idx]]);occ[idx]=1;
          rowLeft[(idx/n)|0]--;colLeft[idx%n]--;
        }
        for(a=0;a<shape.length;a++){
          rr=(shape[a]/n)|0;cc=shape[a]%n;
          for(dr=-1;dr<=1;dr++)for(dc=-1;dc<=1;dc++){
            if(!dr&&!dc)continue;
            nr=rr+dr;nc=cc+dc;
            if(nr<0||nc<0||nr>=n||nc>=n)continue;
            ni=nr*n+nc;
            if(occ[ni]===0){changes.push([ni,0]);occ[ni]=2;}
          }
        }

        var nextStart=(i+1<lens.length&&lens[i+1]===len)?p+1:0;
        dfs(i+1,nextStart);

        for(a=shape.length-1;a>=0;a--){
          idx=shape[a];rowLeft[(idx/n)|0]++;colLeft[idx%n]++;
        }
        for(a=changes.length-1;a>=0;a--)occ[changes[a][0]]=changes[a][1];
        if(aborted||count>=limit)return;
      }
    }

    dfs(0,0);
    return {count:count,aborted:aborted};
  }

  function copyObj(obj){
    var out={};
    for(var k in obj)if(obj[k])out[Number(k)]=1;
    return out;
  }

  /* Prüft, ob nur durch zwingende Schlüsse alle Schiffsfelder bestimmbar sind. */
  function logicalCheck(n,ships,row,col,givens,deadline,callback){
    var knownShip=copyObj(givens),knownWater={},cursor=0,changed=false;
    var total=ships.reduce(function(a,b){return a+b;},0);

    function shipCount(){
      var c=0;for(var k in knownShip)if(knownShip[k])c++;return c;
    }
    function step(){
      if(Date.now()>deadline-25){callback(false);return;}
      if(shipCount()===total){callback(true);return;}
      while(cursor<n*n&&(knownShip[cursor]||knownWater[cursor]))cursor++;
      if(cursor>=n*n){
        if(!changed){callback(false);return;}
        cursor=0;changed=false;setTimeout(step,0);return;
      }

      var idx=cursor,waterTry=copyObj(knownWater);
      waterTry[idx]=1;
      var result=countSolutions(n,ships,row,col,knownShip,waterTry,1,Math.min(CHUNK_MS,deadline-Date.now()));
      if(result.aborted){callback(false);return;}
      if(result.count===0){
        knownShip[idx]=1;changed=true;cursor++;setTimeout(step,0);return;
      }

      var shipTry=copyObj(knownShip);
      shipTry[idx]=1;
      result=countSolutions(n,ships,row,col,shipTry,knownWater,1,Math.min(CHUNK_MS,deadline-Date.now()));
      if(result.aborted){callback(false);return;}
      if(result.count===0){knownWater[idx]=1;changed=true;}
      cursor++;setTimeout(step,0);
    }
    setTimeout(step,0);
  }

  function safeFallback(key){
    var cfg=DIFF[key],grid=makeSolution(cfg.n,cfg.ships);
    while(!grid)grid=makeSolution(cfg.n,cfg.ships);
    var sums=sumsOf(grid,cfg.n),shipCells=[];
    for(var i=0;i<grid.length;i++)if(grid[i])shipCells.push(i);
    shuffle(shipCells);
    var given={};
    /* Ein Feld bleibt offen; die Flottensumme erzwingt genau dieses Feld. */
    for(i=0;i<shipCells.length-1;i++)given[shipCells[i]]=1;
    return {n:cfg.n,ships:cfg.ships.slice(),grid:grid,row:sums.row,col:sums.col,given:given,unique:true};
  }

  function generatePuzzle(key,callback){
    var cfg=DIFF[key],n=cfg.n,ships=cfg.ships.slice().sort(function(a,b){return b-a;});
    var deadline=Date.now()+GEN_MS,attempt=0;

    function tryBoard(){
      if(Date.now()>deadline-80||attempt++>=20){callback(safeFallback(key));return;}
      var grid=makeSolution(n,ships);
      if(!grid){setTimeout(tryBoard,0);return;}
      var sums=sumsOf(grid,n),shipCells=[];
      for(var i=0;i<n*n;i++)if(grid[i])shipCells.push(i);
      shuffle(shipCells);
      var given={},g=0;

      function addHint(){
        if(g>=shipCells.length-1){callback(safeFallback(key));return;}
        given[shipCells[g++]]=1;
        setTimeout(test,0);
      }
      function test(){
        if(Date.now()>deadline-80){callback(safeFallback(key));return;}
        var result=countSolutions(n,ships,sums.row,sums.col,given,{},2,Math.min(CHUNK_MS,deadline-Date.now()));
        if(result.aborted||result.count!==1){addHint();return;}

        logicalCheck(n,ships,sums.row,sums.col,given,deadline,function(ok){
          if(!ok){addHint();return;}
          /* Mehr Vorgaben machen das Rätsel leichter, aber nicht mehrdeutig. */
          for(var e=0;e<cfg.extra&&g<shipCells.length;e++)given[shipCells[g++]]=1;
          callback({n:n,ships:cfg.ships.slice(),grid:grid,row:sums.row,col:sums.col,given:copyObj(given),unique:true});
        });
      }
      setTimeout(test,0);
    }
    setTimeout(tryBoard,0);
  }

  function requestPuzzle(key,callback){
    if(cache[key]){
      var ready=cache[key];cache[key]=null;callback(ready);return;
    }
    if(jobs[key]){
      jobs[key].waiters.push(callback);return;
    }
    jobs[key]={waiters:[callback]};
    generatePuzzle(key,function(puzzle){
      var job=jobs[key],waiters=job?job.waiters:[];
      jobs[key]=null;
      if(waiters.length){
        waiters[0](puzzle);
        for(var i=1;i<waiters.length;i++)waiters[i](safeFallback(key));
      }else cache[key]=puzzle;
    });
  }

  function pregen(key){
    if(cache[key]||jobs[key])return;
    setTimeout(function(){
      if(!cache[key]&&!jobs[key])requestPuzzle(key,function(p){cache[key]=p;});
    },PREGEN_DELAY);
  }

  function newGame(key,advance){
    if(loading)return;
    var level=advance&&S?S.level+1:1;
    setLoading(true);
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        requestPuzzle(key,function(puzzle){
          setLoading(false);
          startGame(puzzle,key,level);
          pregen(key);
        });
      });
    });
  }

  function startGame(p,key,level){
    var given=copyObj(p.given),user=new Uint8Array(p.n*p.n);
    for(var k in given)user[Number(k)]=1;
    S={n:p.n,diff:key,ships:p.ships.slice(),solution:p.grid,row:p.row,col:p.col,
      given:given,user:user,level:level,solved:false,cheated:false};
    history=[];pending=null;drag=null;winModal.hidden=true;
    buildBoard();render();startTimer();save();
  }

  function buildBoard(){
    var n=S.n;
    board.innerHTML='';board.style.gridTemplateColumns='repeat('+n+',1fr)';
    board.style.gridTemplateRows='repeat('+n+',1fr)';
    cells=[];rowEls=[];colEls=[];
    for(var r=0;r<n;r++)for(var c=0;c<n;c++){
      var el=document.createElement('div');el.className='cell';el.dataset.i=String(r*n+c);
      board.appendChild(el);cells[r*n+c]=el;
    }
    shipLayer=document.createElement('div');shipLayer.className='ships';board.appendChild(shipLayer);
    rowClues.innerHTML='';colClues.innerHTML='';
    rowClues.style.gridTemplateRows='repeat('+n+',1fr)';
    colClues.style.gridTemplateColumns='repeat('+n+',1fr)';
    for(r=0;r<n;r++){var a=document.createElement('span');a.className='clue';a.innerHTML='<span class="clue__text"></span>';rowClues.appendChild(a);rowEls.push(a);}
    for(c=0;c<n;c++){var b=document.createElement('span');b.className='clue';b.innerHTML='<span class="clue__text"></span>';colClues.appendChild(b);colEls.push(b);}
  }

  function components(){
    var n=S.n,seen=new Uint8Array(n*n),out=[];
    for(var i=0;i<n*n;i++){
      if(S.user[i]!==1||seen[i])continue;
      var stack=[i],list=[];seen[i]=1;
      while(stack.length){
        var j=stack.pop();list.push(j);
        var r=(j/n)|0,c=j%n,nb=[[1,0],[-1,0],[0,1],[0,-1]];
        for(var k=0;k<4;k++){
          var rr=r+nb[k][0],cc=c+nb[k][1];
          if(rr<0||cc<0||rr>=n||cc>=n)continue;
          var q=rr*n+cc;
          if(S.user[q]===1&&!seen[q]){seen[q]=1;stack.push(q);}
        }
      }
      var rows={},cols={},nr=0,nc=0;
      for(var z=0;z<list.length;z++){
        var r2=(list[z]/n)|0,c2=list[z]%n;
        if(!rows[r2]){rows[r2]=1;nr++;}
        if(!cols[c2]){cols[c2]=1;nc++;}
      }
      out.push({cells:list.sort(function(a,b){return a-b;}),len:list.length,straight:nr===1||nc===1});
    }
    return out;
  }

  function badCells(){
    var n=S.n,bad={},r,c;
    for(r=0;r<n;r++)for(c=0;c<n;c++){
      if(S.user[r*n+c]!==1)continue;
      if(r+1<n&&c+1<n&&S.user[(r+1)*n+c+1]===1){bad[r*n+c]=1;bad[(r+1)*n+c+1]=1;}
      if(r+1<n&&c>0&&S.user[(r+1)*n+c-1]===1){bad[r*n+c]=1;bad[(r+1)*n+c-1]=1;}
    }
    var need={};for(var i=0;i<S.ships.length;i++)need[S.ships[i]]=(need[S.ships[i]]||0)+1;
    var comps=components();
    for(i=0;i<comps.length;i++)if(!comps[i].straight||!need[comps[i].len])
      for(var k=0;k<comps[i].cells.length;k++)bad[comps[i].cells[k]]=1;
    return bad;
  }

  function solved(){
    var n=S.n,r,c,count;
    for(r=0;r<n;r++){count=0;for(c=0;c<n;c++)if(S.user[r*n+c]===1)count++;if(count!==S.row[r])return false;}
    for(c=0;c<n;c++){count=0;for(r=0;r<n;r++)if(S.user[r*n+c]===1)count++;if(count!==S.col[c])return false;}
    var got={},need={},comps=components();
    for(var i=0;i<comps.length;i++){
      if(!comps[i].straight)return false;
      got[comps[i].len]=(got[comps[i].len]||0)+1;
    }
    for(i=0;i<S.ships.length;i++)need[S.ships[i]]=(need[S.ships[i]]||0)+1;
    for(var k in need)if(got[k]!==need[k])return false;
    for(k in got)if(!need[k])return false;
    return Object.keys(badCells()).length===0;
  }

  function renderFleet(){
    var need={},done={},comps=components(),html='';
    for(var i=0;i<S.ships.length;i++)need[S.ships[i]]=(need[S.ships[i]]||0)+1;
    for(i=0;i<comps.length;i++)if(comps[i].straight&&need[comps[i].len])
      done[comps[i].len]=(done[comps[i].len]||0)+1;
    var lengths=Object.keys(need).map(Number).sort(function(a,b){return b-a;});
    for(i=0;i<lengths.length;i++){
      var len=lengths[i];
      for(var q=0;q<need[len];q++)
        html+='<span class="shape'+(q<(done[len]||0)?' is-done':'')+'" style="width:calc(var(--u) * '+len+')"></span>';
    }
    fleet.innerHTML=html;
  }

  function renderShips(){
    var n=S.n,comps=components(),html='',pad=.055;
    for(var i=0;i<comps.length;i++){
      var comp=comps[i],a=comp.cells[0],b=comp.cells[comp.cells.length-1];
      var r0=(a/n)|0,c0=a%n,r1=(b/n)|0,c1=b%n,top,left,w,h;
      if(!comp.straight){
        for(var z=0;z<comp.cells.length;z++){
          var idx=comp.cells[z],rr=(idx/n)|0,cc=idx%n,p=.07;
          html+='<div class="pill pill--bad" style="left:'+((cc+p)/n*100)+'%;top:'+((rr+p)/n*100)+'%;width:'+((1-2*p)/n*100)+'%;height:'+((1-2*p)/n*100)+'%"></div>';
        }
        continue;
      }
      if(r1!==r0){left=(c0+pad)/n*100;w=(1-2*pad)/n*100;top=(Math.min(r0,r1)+pad)/n*100;h=(comp.len-2*pad)/n*100;}
      else{top=(r0+pad)/n*100;h=(1-2*pad)/n*100;left=(Math.min(c0,c1)+pad)/n*100;w=(comp.len-2*pad)/n*100;}
      html+='<div class="pill" style="left:'+left+'%;top:'+top+'%;width:'+w+'%;height:'+h+'%"></div>';
    }
    shipLayer.innerHTML=html;
  }

  function render(){
    var n=S.n,bad=badCells(),r,c,count;
    for(var i=0;i<n*n;i++){
      cells[i].className='cell'+(S.user[i]===2?' cell--water':S.user[i]===1?' cell--ship':'')+(bad[i]?' cell--bad':'');
    }
    for(r=0;r<n;r++){
      count=0;for(c=0;c<n;c++)if(S.user[r*n+c]===1)count++;
      rowEls[r].className='clue'+(count>S.row[r]?' is-over':'');
      rowEls[r].firstChild.innerHTML=(count?'<i class="clue__count">'+count+'</i>':'')+S.row[r];
    }
    for(c=0;c<n;c++){
      count=0;for(r=0;r<n;r++)if(S.user[r*n+c]===1)count++;
      colEls[c].className='clue'+(count>S.col[c]?' is-over':'');
      colEls[c].firstChild.innerHTML=(count?'<i class="clue__count">'+count+'</i>':'')+S.col[c];
    }
    renderShips();renderFleet();
    if(!S.solved&&!S.cheated&&solved()){
      S.solved=true;stopTimer();$('winTitle').textContent='Rätsel '+S.level+' gelöst';
      $('winTime').textContent='Zeit '+timeText(elapsed);winModal.hidden=false;save();
    }
  }

  function save(){
    if(!S)return;
    try{
      var given=[];
      for(var i=0;i<S.n*S.n;i++)if(S.given[i])given.push(i);
      localStorage.setItem(STORAGE,JSON.stringify({
        n:S.n,diff:S.diff,ships:S.ships,solution:Array.from(S.solution),row:S.row,col:S.col,
        given:given,user:Array.from(S.user),level:S.level,solved:S.solved,cheated:S.cheated
      }));
    }catch(e){}
  }

  function load(){
    try{
      var d=JSON.parse(localStorage.getItem(STORAGE)||'null');
      if(!d||!DIFF[d.diff]||!Array.isArray(d.user)||d.user.length!==d.n*d.n)return false;
      var given={};(d.given||[]).forEach(function(i){given[i]=1;});
      S={n:d.n,diff:d.diff,ships:d.ships,solution:Uint8Array.from(d.solution),row:d.row,col:d.col,
        given:given,user:Uint8Array.from(d.user),level:d.level||1,solved:!!d.solved,cheated:!!d.cheated};
      difficulty.value=d.diff;buildBoard();render();startTimer();pregen(d.diff);return true;
    }catch(e){return false;}
  }

  function commit(){
    if(pending&&pending.length){history.push(pending);if(history.length>100)history.shift();save();}
    pending=null;
  }
  function setCell(idx,value){
    if(S.given[idx]||S.user[idx]===value)return;
    pending.push({i:idx,old:S.user[idx]});S.user[idx]=value;
  }

  board.addEventListener('pointerdown',function(e){
    if(!S||loading)return;
    var el=e.target.closest('.cell');if(!el)return;
    var idx=Number(el.dataset.i);if(S.given[idx])return;
    e.preventDefault();pending=[];
    drag={idx:idx,prev:S.user[idx],value:NEXT[S.user[idx]],moved:false,x:e.clientX,y:e.clientY};
    try{board.setPointerCapture(e.pointerId);}catch(err){}
  });
  board.addEventListener('pointermove',function(e){
    if(!drag)return;
    if(!drag.moved){
      var dx=e.clientX-drag.x,dy=e.clientY-drag.y;
      if(Math.hypot(dx,dy)<9)return;
      drag.moved=true;setCell(drag.idx,drag.value);render();
    }
    var el=document.elementFromPoint(e.clientX,e.clientY);
    var cell=el&&el.closest?el.closest('.cell'):null;if(!cell)return;
    var idx=Number(cell.dataset.i);
    if(!S.given[idx]&&S.user[idx]!==drag.value){setCell(idx,drag.value);render();}
  });
  board.addEventListener('pointerup',function(e){
    if(!drag)return;
    if(!drag.moved)setCell(drag.idx,drag.value);
    drag=null;commit();render();
    try{board.releasePointerCapture(e.pointerId);}catch(err){}
  });
  board.addEventListener('pointercancel',function(){drag=null;pending=null;render();});

  $('undo').addEventListener('click',function(){
    var last=history.pop();if(!last)return;
    for(var i=last.length-1;i>=0;i--)S.user[last[i].i]=last[i].old;
    save();render();
  });
  $('clear').addEventListener('click',function(){
    var changes=[];
    for(var i=0;i<S.n*S.n;i++)if(!S.given[i]&&S.user[i]!==0){
      changes.push({i:i,old:S.user[i]});S.user[i]=0;
    }
    if(changes.length){history.push(changes);save();render();}
  });
  $('showSolution').addEventListener('click',function(){
    if(!confirm('Lösung einblenden?'))return;
    for(var i=0;i<S.n*S.n;i++)if(!S.given[i])S.user[i]=S.solution[i]?1:2;
    S.cheated=true;save();render();
  });
  $('newGame').addEventListener('click',function(){newGame(difficulty.value,false);});
  difficulty.addEventListener('change',function(){newGame(difficulty.value,false);});
  $('nextGame').addEventListener('click',function(){newGame(difficulty.value,true);});
  $('closeWin').addEventListener('click',function(){winModal.hidden=true;});

  if(!load())newGame(difficulty.value,false);
})();
</script>

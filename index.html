<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#2b2b2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bimaru">
<title>Bimaru</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:#2b2b2b;color:#e9e9e9;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none;user-select:none;
    display:flex;flex-direction:column;min-height:100dvh;
    padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 6px);
  }
  .app{width:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;flex:1;padding:0 14px}

  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 2px 4px}
  .timer{display:flex;align-items:center;gap:8px;font-size:20px;font-variant-numeric:tabular-nums;color:#dcdcdc}
  .timer svg{width:19px;height:19px;fill:none;stroke:#c8c8c8;stroke-width:1.9;stroke-linecap:round}
  .top__actions{display:flex;align-items:center;gap:12px}
  .ghost{appearance:none;border:0;background:none;color:#cfcfcf;font:inherit;font-size:16px;padding:6px 2px}
  .ghost:active{opacity:.55}
  .select{
    appearance:none;-webkit-appearance:none;
    background:#333;color:#dcdcdc;border:1px solid #4a4a4a;border-radius:9px;
    font:inherit;font-size:14px;padding:7px 8px;
  }

  .fleet{
    display:flex;flex-wrap:wrap;justify-content:center;align-items:center;
    gap:7px 15px;padding:10px 0 14px;--u:12px;min-height:48px;
  }
  .shape{height:var(--u);border-radius:99px;background:#4a4a4a;transition:background .15s}
  .shape.is-done{background:#fff}

  .stage{flex:1;display:flex;align-items:flex-start}
  .gridwrap{
    --cl:26px;width:100%;display:grid;
    grid-template-columns:1fr var(--cl);
    grid-template-rows:auto var(--cl);
  }
  .board{
    position:relative;width:100%;aspect-ratio:1;display:grid;
    background:#191919;border:2px solid #f2f2f2;border-radius:14px;
    overflow:hidden;touch-action:none;
  }
  .cell{
    position:relative;background:#191919;
    box-shadow:inset 0 -1px 0 rgba(255,255,255,.06),inset -1px 0 0 rgba(255,255,255,.06);
  }
  .cell--water,.cell--ship{background:#0a76dd}
  .cell--bad{z-index:3;border-radius:8px;outline:2px solid #ff5252;outline-offset:-2px}

  .ships{position:absolute;inset:0;pointer-events:none}
  .pill{position:absolute;background:#fff;border-radius:99px}
  .pill--bad{border-radius:50%;outline:2px solid #ff5252;outline-offset:-1px}

  .clues{
    display:grid;color:#d0d0d0;font-size:15px;font-weight:500;
    font-variant-numeric:tabular-nums;
  }
  .clues--right{grid-template-columns:1fr;justify-items:center;padding-left:9px}
  .clues--bottom{grid-template-rows:1fr;justify-items:center;align-items:center;padding-top:8px}
  .clue{display:grid;place-items:center;width:100%;height:100%}
  .clue__text{white-space:nowrap}
  .clue__text i{font-style:normal;font-size:9px;font-weight:700;vertical-align:super;color:#7fb2ff;margin-right:1px}
  .clue.is-ok{color:#5ee08a}
  .clue.is-ok .clue__text i{color:#5ee08a}
  .clue.is-over{color:#ff5252}
  .clue.is-over .clue__text i{color:#ff5252}

  .actions{display:flex;align-items:center;justify-content:center;gap:12px;padding:16px 0 6px}
  .undo{
    appearance:none;-webkit-appearance:none;
    width:56%;height:54px;border-radius:13px;
    border:1px solid #4a4a4a;background:#303030;color:#9e9e9e;
    display:flex;align-items:center;justify-content:center;
  }
  .undo:active{background:#3a3a3a;transform:scale(.98)}
  .undo svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .mini{
    appearance:none;-webkit-appearance:none;
    height:54px;padding:0 16px;border-radius:13px;
    border:1px solid #4a4a4a;background:#303030;color:#cfcfcf;font:inherit;font-size:15px;
  }
  .mini:active{background:#3a3a3a}

  .modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:24px;background:rgba(0,0,0,.6)}
  .modal[hidden]{display:none}
  .modal__card{width:100%;max-width:300px;background:#333;border:1px solid #4a4a4a;border-radius:20px;padding:22px;text-align:center}
  .modal__kicker{margin:0 0 4px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#5ee08a}
  .modal__title{margin:0 0 6px;font-size:20px;font-weight:600}
  .modal__time{margin:0 0 18px;font-size:14px;color:#9a9a9a;font-variant-numeric:tabular-nums}
  .modal .mini{width:100%;margin-top:8px;background:#0a76dd;border-color:#0a76dd;color:#fff}

  /* Lade-Overlay */
  .loader{
    position:fixed;inset:0;z-index:40;display:grid;place-items:center;
    background:rgba(24,24,24,.84);
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  }
  .loader[hidden]{display:none}
  .loader__card{display:flex;flex-direction:column;align-items:center;gap:14px;color:#cfcfcf;font-size:14px}
  .spinner{
    width:36px;height:36px;border-radius:50%;
    border:3px solid #4a4a4a;border-top-color:#0a76dd;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="timer">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span id="time">00:00</span>
    </div>
    <div class="top__actions">
      <select id="size" class="select" aria-label="Grösse">
        <option value="8">8 × 8</option>
        <option value="10">10 × 10</option>
      </select>
      <button id="solve" class="ghost" type="button">Ergebnis</button>
    </div>
  </header>

  <div class="fleet" id="fleet" aria-label="Flotte"></div>

  <div class="stage">
    <div class="gridwrap">
      <div class="board" id="board" aria-label="Spielfeld"></div>
      <div class="clues clues--right" id="cluesR"></div>
      <div class="clues clues--bottom" id="cluesB"></div>
    </div>
  </div>

  <div class="actions">
    <button class="mini" id="clear" type="button">Leeren</button>
    <button class="undo" id="undo" type="button" aria-label="Zug zurück">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7 4 12l5 5"/><path d="M4 12h9a5 5 0 0 1 0 10h-2"/></svg>
    </button>
    <button class="mini" id="new" type="button">Neu</button>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal__card">
    <p class="modal__kicker">Geschafft</p>
    <h2 class="modal__title" id="modalTitle">Rätsel 1 gelöst</h2>
    <p class="modal__time" id="modalTime">00:00</p>
    <button class="mini" id="next" type="button">Nächstes Rätsel</button>
    <button class="mini" id="close" type="button">Brett ansehen</button>
  </div>
</div>

<div class="loader" id="loader" hidden>
  <div class="loader__card">
    <div class="spinner"></div>
    <span>Rätsel wird erzeugt …</span>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* Zustände: 0 = schwarz, 2 = Wasser, 1 = Schiff. Tippen: 0 -> 2 -> 1 -> 0 */
  var NEXT = { 0: 2, 2: 1, 1: 0 };

  var CONFIG = {
    '8':  { n: 8,  ships: [3, 2, 2, 1, 1, 1] },
    '10': { n: 10, ships: [4, 3, 3, 2, 2, 2, 1, 1, 1, 1] }
  };

  var CHUNK_MS   = 60;    /* Rechenzeit pro Häppchen, danach wird gezeichnet */
  var GEN_BUDGET = 3500;  /* gesamte Suchzeit pro Rätsel */
  var PREGEN_DELAY = 500; /* Ruhe nach Spielstart, bevor vorab gerechnet wird */

  var KEY = 'bimaru.v6';

  var boardEl = document.getElementById('board');
  var fleetEl = document.getElementById('fleet');
  var cluesR  = document.getElementById('cluesR');
  var cluesB  = document.getElementById('cluesB');
  var timeEl  = document.getElementById('time');
  var sizeEl  = document.getElementById('size');
  var modalEl = document.getElementById('modal');
  var loaderEl = document.getElementById('loader');
  var modalTitle = document.getElementById('modalTitle');
  var modalTime  = document.getElementById('modalTime');

  var S = null;
  var history = [];
  var pending = null;
  var drag = null;
  var cells = [], rowEls = [], colEls = [], shipLayer = null;
  var timerId = null, elapsed = 0, startAt = 0;
  var loading = false;

  /* Vorrat und Status der Hintergrundberechnung */
  var cache = { '8': null, '10': null };
  var pregenBusy = { '8': false, '10': false };

  function rnd(n) { return Math.floor(Math.random() * n); }
  function fmt(s) {
    var m = Math.floor(s / 60), r = s % 60;
    return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r;
  }
  function startTimer() {
    stopTimer();
    startAt = Date.now(); elapsed = 0; timeEl.textContent = '00:00';
    timerId = setInterval(function () {
      elapsed = Math.floor((Date.now() - startAt) / 1000);
      timeEl.textContent = fmt(elapsed);
    }, 500);
  }
  function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = rnd(i + 1), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function showLoader(on) {
    loading = !!on;
    loaderEl.hidden = !on;
  }

  /* ================= Generator der Lösung ================= */

  function fits(grid, n, list) {
    var own = {}, i, k;
    for (i = 0; i < list.length; i++) own[list[i]] = 1;
    for (k = 0; k < list.length; k++) {
      var idx = list[k], r = (idx / n) | 0, c = idx % n;
      for (var dr = -1; dr <= 1; dr++) {
        for (var dc = -1; dc <= 1; dc++) {
          var rr = r + dr, cc = c + dc;
          if (rr < 0 || cc < 0 || rr >= n || cc >= n) continue;
          var j = rr * n + cc;
          if (own[j]) continue;
          if (grid[j]) return false;
        }
      }
    }
    return true;
  }

  function makeSolution(n, ships) {
    var order = ships.slice().sort(function (a, b) { return b - a; });
    for (var attempt = 0; attempt < 400; attempt++) {
      var grid = new Uint8Array(n * n), ok = true;
      for (var i = 0; i < order.length && ok; i++) {
        var len = order[i], placed = false;
        for (var t = 0; t < 400; t++) {
          var horiz = Math.random() < 0.5, r, c, k, list = [];
          if (horiz) { r = rnd(n); c = rnd(n - len + 1); }
          else { r = rnd(n - len + 1); c = rnd(n); }
          for (k = 0; k < len; k++) list.push(horiz ? r * n + c + k : (r + k) * n + c);
          if (fits(grid, n, list)) {
            for (k = 0; k < len; k++) grid[list[k]] = 1;
            placed = true;
            break;
          }
        }
        if (!placed) ok = false;
      }
      if (ok) return grid;
    }
    return null;
  }

  /* ================= Löser: zählt Lösungen ================= */

  function buildPlacements(n, len) {
    var out = [], r, c, k, list;
    if (len === 1) {
      for (r = 0; r < n; r++) for (c = 0; c < n; c++) out.push([r * n + c]);
      return out;
    }
    for (r = 0; r < n; r++) {
      for (c = 0; c + len <= n; c++) {
        list = [];
        for (k = 0; k < len; k++) list.push(r * n + c + k);
        out.push(list);
      }
    }
    for (c = 0; c < n; c++) {
      for (r = 0; r + len <= n; r++) {
        list = [];
        for (k = 0; k < len; k++) list.push((r + k) * n + c);
        out.push(list);
      }
    }
    return out;
  }

  /* occ: 0 frei, 1 Schiff, 2 blockiert (Nachbar eines Schiffs) */
  function countSolutions(n, ships, rowSum, colSum, given, limit, timeMs) {
    var lens = ships.slice().sort(function (a, b) { return b - a; });
    var cacheP = {}, i, L;
    for (i = 0; i < lens.length; i++) {
      L = lens[i];
      if (!cacheP[L]) cacheP[L] = buildPlacements(n, L);
    }

    var occ = new Uint8Array(n * n);
    var rowLeft = rowSum.slice();
    var colLeft = colSum.slice();
    var givenList = [], gIndex = {};
    for (var key in given) {
      if (!given[key]) continue;
      var gi = Number(key);
      givenList.push(gi);
      gIndex[gi] = 1;
    }
    var covered = new Uint8Array(n * n);
    var uncovered = givenList.length;

    var rUse = new Int32Array(n), cUse = new Int32Array(n);
    var freeRow = new Int32Array(n), freeCol = new Int32Array(n);

    var count = 0, nodes = 0, aborted = false;
    var deadline = Date.now() + (timeMs || 300);

    function apply(list, stack) {
      for (var a = 0; a < list.length; a++) {
        var idx = list[a], r = (idx / n) | 0, c = idx % n;
        occ[idx] = 1; stack.push(idx);
        rowLeft[r]--; colLeft[c]--;
        if (gIndex[idx]) { covered[idx] = 1; uncovered--; }
        for (var dr = -1; dr <= 1; dr++) {
          for (var dc = -1; dc <= 1; dc++) {
            if (dr === 0 && dc === 0) continue;
            var rr = r + dr, cc = c + dc;
            if (rr < 0 || cc < 0 || rr >= n || cc >= n) continue;
            var j = rr * n + cc;
            if (occ[j] === 0) { occ[j] = 2; stack.push(j); }
          }
        }
      }
    }

    function undo(list, stack) {
      for (var a = list.length - 1; a >= 0; a--) {
        var idx = list[a], r = (idx / n) | 0, c = idx % n;
        rowLeft[r]++; colLeft[c]++;
        if (gIndex[idx]) { covered[idx] = 0; uncovered++; }
      }
      for (var s = stack.length - 1; s >= 0; s--) occ[stack[s]] = 0;
    }

    function feasible(i) {
      if (uncovered > 0) {
        for (var g = 0; g < givenList.length; g++) {
          var gi = givenList[g];
          if (covered[gi]) continue;
          if (occ[gi] !== 0) return false;
          if (rowLeft[(gi / n) | 0] <= 0 || colLeft[gi % n] <= 0) return false;
        }
        var rem = 0;
        for (var q = i; q < lens.length; q++) rem += lens[q];
        if (uncovered > rem) return false;
      }
      freeRow.fill(0); freeCol.fill(0);
      for (var rr = 0; rr < n; rr++) {
        for (var cc = 0; cc < n; cc++) {
          if (occ[rr * n + cc] === 0) { freeRow[rr]++; freeCol[cc]++; }
        }
      }
      for (var x = 0; x < n; x++) {
        if (freeRow[x] < rowLeft[x]) return false;
        if (freeCol[x] < colLeft[x]) return false;
      }
      return true;
    }

    function dfs(i) {
      if (aborted) return;
      nodes++;
      if ((nodes & 255) === 0 && Date.now() > deadline) { aborted = true; return; }

      if (i === lens.length) {
        if (uncovered === 0) count++;
        return;
      }
      if (!feasible(i)) return;

      var list = cacheP[lens[i]];
      for (var p = 0; p < list.length; p++) {
        var cellsP = list[p], ok = true, a;
        rUse.fill(0); cUse.fill(0);
        for (a = 0; a < cellsP.length; a++) {
          var idx = cellsP[a];
          if (occ[idx] !== 0) { ok = false; break; }
          rUse[(idx / n) | 0]++; cUse[idx % n]++;
        }
        if (!ok) continue;
        for (a = 0; a < n; a++) {
          if (rUse[a] > rowLeft[a] || cUse[a] > colLeft[a]) { ok = false; break; }
        }
        if (!ok) continue;

        var stack = [];
        apply(cellsP, stack);
        dfs(i + 1);
        undo(cellsP, stack);
        if (aborted) return;
        if (count >= limit) return;
      }
    }

    dfs(0);
    return { count: count, aborted: aborted };
  }

  /* ================= Rätsel bauen (zerlegt) ================= */

  function sumsOf(grid, n) {
    var row = [], col = [], i;
    for (i = 0; i < n; i++) { row.push(0); col.push(0); }
    for (i = 0; i < n * n; i++) {
      if (grid[i]) { row[(i / n) | 0]++; col[i % n]++; }
    }
    return { row: row, col: col };
  }

  function copyGiven(given) {
    var out = {}, k;
    for (k in given) if (given[k]) out[Number(k)] = 1;
    return out;
  }

  /* Erzeugt schrittweise ein Rätsel. Jeder Solver-Lauf ist auf CHUNK_MS
     begrenzt, dazwischen gibt der Aufrufer mit setTimeout an den Browser ab. */
  function makePuzzleAsync(key, onDone) {
    var cfg = CONFIG[key], n = cfg.n;
    var ships = cfg.ships.slice().sort(function (a, b) { return b - a; });
    var deadline = Date.now() + GEN_BUDGET;
    var fallback = null;
    var attempts = 0;

    function finish(pz) { onDone(pz); }

    function useFallback() {
      finish(fallback || fallbackPuzzle(key));
    }

    function nextAttempt() {
      if (attempts >= 12 || Date.now() > deadline - 40) { useFallback(); return; }
      attempts++;

      var grid = makeSolution(n, ships);
      if (!grid) { setTimeout(nextAttempt, 0); return; }

      var s = sumsOf(grid, n);
      var shipCells = [], i;
      for (i = 0; i < n * n; i++) if (grid[i]) shipCells.push(i);
      shuffle(shipCells);

      var given = {};
      var g = 0;
      var maxGive = Math.max(1, Math.round(shipCells.length * 0.45));

      function snapshot(unique) {
        return {
          n: n, ships: ships.slice(), grid: grid,
          row: s.row.slice(), col: s.col.slice(),
          given: copyGiven(given), unique: !!unique
        };
      }

      function tryGiven() {
        if (g > 0) given[shipCells[g - 1]] = 1;

        var left = Math.min(CHUNK_MS, deadline - Date.now());
        if (left <= 15) { useFallback(); return; }

        var res = countSolutions(n, ships, s.row, s.col, given, 2, left);

        if (res.aborted) {
          fallback = snapshot(false);
          setTimeout(nextAttempt, 0);
          return;
        }
        if (res.count === 1) { finish(snapshot(true)); return; }
        if (res.count === 0) {
          fallback = snapshot(false);
          setTimeout(nextAttempt, 0);
          return;
        }
        fallback = snapshot(false);
        if (g >= maxGive) { setTimeout(nextAttempt, 0); return; }
        g++;
        setTimeout(tryGiven, 0);
      }

      setTimeout(tryGiven, 0);
    }

    setTimeout(nextAttempt, 0);
  }

  function fallbackPuzzle(key) {
    var cfg = CONFIG[key];
    var n = cfg.n;
    var ships = cfg.ships.slice().sort(function (a, b) { return b - a; });
    for (var t = 0; t < 40; t++) {
      var grid = makeSolution(n, ships);
      if (!grid) continue;
      var s = sumsOf(grid, n);
      var shipCells = [], i;
      for (i = 0; i < n * n; i++) if (grid[i]) shipCells.push(i);
      shuffle(shipCells);
      var given = {};
      var c = Math.max(1, Math.round(shipCells.length * 0.3));
      for (i = 0; i < c; i++) given[shipCells[i]] = 1;
      return { n: n, ships: ships, grid: grid, row: s.row, col: s.col, given: given, unique: false };
    }
    return null;
  }

  /* Vorabberechnung für eine Grösse anstossen */
  function schedulePregen(key) {
    if (cache[key] || pregenBusy[key]) return;
    pregenBusy[key] = true;
    setTimeout(function () {
      if (cache[key]) { pregenBusy[key] = false; return; }
      makePuzzleAsync(key, function (pz) {
        pregenBusy[key] = false;
        if (pz && !cache[key]) cache[key] = pz;
      });
    }, PREGEN_DELAY);
  }

  /* ================= Spielzustand ================= */

  function startGame(pz, level) {
    var n = pz.n, i;
    var given = copyGiven(pz.given);
    var user = new Uint8Array(n * n);
    for (var idx in given) user[Number(idx)] = 1;

    S = {
      n: n,
      ships: pz.ships.slice(),
      solution: pz.grid,
      row: pz.row, col: pz.col,
      given: given,
      user: user,
      unique: !!pz.unique,
      level: level,
      solved: false, cheated: false
    };

    history = []; pending = null; drag = null;
    modalEl.hidden = true;
    build();
    render();
    startTimer();
    save();
  }

  function newGame(key, advance) {
    if (loading) return;
    var level = (advance && S) ? S.level + 1 : 1;
    var ready = cache[key];

    if (ready) {
      cache[key] = null;
      startGame(ready, level);
      schedulePregen(key);
      return;
    }

    showLoader(true);
    /* zwei Frames abwarten, damit der Spinner sicher gezeichnet ist */
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        setTimeout(function () {
          makePuzzleAsync(key, function (pz) {
            showLoader(false);
            if (!pz) return;
            startGame(pz, level);
            schedulePregen(key);
          });
        }, 0);
      });
    });
  }

  function build() {
    var n = S.n, r, c;
    boardEl.innerHTML = '';
    boardEl.style.gridTemplateColumns = 'repeat(' + n + ',1fr)';
    boardEl.style.gridTemplateRows = 'repeat(' + n + ',1fr)';
    cells = []; rowEls = []; colEls = [];

    for (r = 0; r < n; r++) {
      for (c = 0; c < n; c++) {
        var cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.i = String(r * n + c);
        boardEl.appendChild(cell);
        cells[r * n + c] = cell;
      }
    }
    shipLayer = document.createElement('div');
    shipLayer.className = 'ships';
    boardEl.appendChild(shipLayer);

    cluesR.innerHTML = '';
    cluesB.innerHTML = '';
    cluesR.style.gridTemplateRows = 'repeat(' + n + ',1fr)';
    cluesB.style.gridTemplateColumns = 'repeat(' + n + ',1fr)';
    for (var r2 = 0; r2 < n; r2++) {
      var a = document.createElement('span');
      a.className = 'clue';
      a.innerHTML = '<span class="clue__text"></span>';
      cluesR.appendChild(a);
      rowEls.push(a);
    }
    for (var c2 = 0; c2 < n; c2++) {
      var b = document.createElement('span');
      b.className = 'clue';
      b.innerHTML = '<span class="clue__text"></span>';
      cluesB.appendChild(b);
      colEls.push(b);
    }
  }

  function components() {
    var n = S.n, u = S.user, seen = new Uint8Array(n * n), out = [];
    for (var i = 0; i < n * n; i++) {
      if (u[i] !== 1 || seen[i]) continue;
      var stack = [i], list = [];
      seen[i] = 1;
      while (stack.length) {
        var j = stack.pop(); list.push(j);
        var r = (j / n) | 0, c = j % n;
        var nb = [[1, 0], [-1, 0], [0, 1], [0, -1]];
        for (var k = 0; k < 4; k++) {
          var rr = r + nb[k][0], cc = c + nb[k][1];
          if (rr < 0 || cc < 0 || rr >= n || cc >= n) continue;
          var q = rr * n + cc;
          if (u[q] === 1 && !seen[q]) { seen[q] = 1; stack.push(q); }
        }
      }
      var rows = {}, cols = {}, rn = 0, cn = 0, z;
      for (z = 0; z < list.length; z++) {
        var r2 = (list[z] / n) | 0, c2 = list[z] % n;
        if (!rows[r2]) { rows[r2] = 1; rn++; }
        if (!cols[c2]) { cols[c2] = 1; cn++; }
      }
      out.push({
        len: list.length,
        cells: list.sort(function (a, b) { return a - b; }),
        straight: rn === 1 || cn === 1
      });
    }
    return out;
  }

  function badCells() {
    var n = S.n, u = S.user, bad = {}, r, c;
    for (r = 0; r < n; r++) {
      for (c = 0; c < n; c++) {
        if (u[r * n + c] !== 1) continue;
        if (r + 1 < n && c + 1 < n && u[(r + 1) * n + c + 1] === 1) {
          bad[r * n + c] = 1; bad[(r + 1) * n + c + 1] = 1;
        }
        if (r + 1 < n && c - 1 >= 0 && u[(r + 1) * n + c - 1] === 1) {
          bad[r * n + c] = 1; bad[(r + 1) * n + c - 1] = 1;
        }
      }
    }
    var comps = components();
    for (var i = 0; i < comps.length; i++) {
      if (!comps[i].straight) {
        for (var k = 0; k < comps[i].cells.length; k++) bad[comps[i].cells[k]] = 1;
      }
    }
    return bad;
  }

  function isSolved() {
    var n = S.n, u = S.user, r, c, s, i;
    for (r = 0; r < n; r++) {
      s = 0;
      for (c = 0; c < n; c++) if (u[r * n + c] === 1) s++;
      if (s !== S.row[r]) return false;
    }
    for (c = 0; c < n; c++) {
      s = 0;
      for (r = 0; r < n; r++) if (u[r * n + c] === 1) s++;
      if (s !== S.col[c]) return false;
    }
    var comps = components(), got = {}, need = {};
    for (i = 0; i < comps.length; i++) {
      if (!comps[i].straight) return false;
      got[comps[i].len] = (got[comps[i].len] || 0) + 1;
    }
    for (i = 0; i < S.ships.length; i++) need[S.ships[i]] = (need[S.ships[i]] || 0) + 1;
    for (var k in need) if (got[k] !== need[k]) return false;
    for (var g in got) if (!need[g]) return false;
    for (var b in badCells()) return false;
    return true;
  }

  function renderFleet() {
    var comps = components(), placed = {}, need = {}, i, html = '';
    for (i = 0; i < comps.length; i++) {
      if (comps[i].straight) placed[comps[i].len] = (placed[comps[i].len] || 0) + 1;
    }
    for (i = 0; i < S.ships.length; i++) need[S.ships[i]] = (need[S.ships[i]] || 0) + 1;

    var lens = [];
    for (var k in need) lens.push(Number(k));
    lens.sort(function (a, b) { return b - a; });

    for (i = 0; i < lens.length; i++) {
      var L = lens[i], done = placed[L] || 0;
      for (var q = 0; q < need[L]; q++) {
        var cls = 'shape' + (q < done ? ' is-done' : '');
        html += '<span class="' + cls + '" style="width:calc(var(--u) * ' + L + ')"></span>';
      }
    }
    fleetEl.innerHTML = html;
  }

  function renderShips() {
    var n = S.n, comps = components(), html = '', i, p = 0.055;
    for (i = 0; i < comps.length; i++) {
      var comp = comps[i];
      if (comp.straight) {
        var list = comp.cells;
        var a = list[0], b = list[list.length - 1];
        var r0 = (a / n) | 0, c0 = a % n;
        var r1 = (b / n) | 0, c1 = b % n;
        var top, left, w, h;
        if (r1 !== r0) {
          var minR = Math.min(r0, r1);
          left = ((c0 + p) / n) * 100;
          w = ((1 - 2 * p) / n) * 100;
          top = ((minR + p) / n) * 100;
          h = ((comp.len - 2 * p) / n) * 100;
        } else {
          var minC = Math.min(c0, c1);
          top = ((r0 + p) / n) * 100;
          h = ((1 - 2 * p) / n) * 100;
          left = ((minC + p) / n) * 100;
          w = ((comp.len - 2 * p) / n) * 100;
        }
        html += '<div class="pill" style="left:' + left + '%;top:' + top +
                '%;width:' + w + '%;height:' + h + '%"></div>';
      } else {
        var q2 = 0.07;
        for (var k = 0; k < comp.cells.length; k++) {
          var idx = comp.cells[k], rr = (idx / n) | 0, cc = idx % n;
          html += '<div class="pill pill--bad" style="left:' + (((cc + q2) / n) * 100) +
                  '%;top:' + (((rr + q2) / n) * 100) +
                  '%;width:' + (((1 - 2 * q2) / n) * 100) +
                  '%;height:' + (((1 - 2 * q2) / n) * 100) + '%"></div>';
        }
      }
    }
    shipLayer.innerHTML = html;
  }

  function render() {
    var n = S.n, bad = badCells(), i, r, c, s;
    var rowG = [], colG = [];

    for (i = 0; i < n; i++) { rowG.push(0); colG.push(0); }
    for (i = 0; i < n * n; i++) {
      if (!S.given[i]) continue;
      rowG[(i / n) | 0]++;
      colG[i % n]++;
    }

    for (i = 0; i < n * n; i++) {
      var cls = 'cell';
      if (S.user[i] === 2) cls += ' cell--water';
      else if (S.user[i] === 1) cls += ' cell--ship';
      if (bad[i]) cls += ' cell--bad';
      cells[i].className = cls;
    }

    for (r = 0; r < n; r++) {
      s = 0;
      for (c = 0; c < n; c++) if (S.user[r * n + c] === 1) s++;
      rowEls[r].className = 'clue' + (s === S.row[r] ? ' is-ok' : (s > S.row[r] ? ' is-over' : ''));
      rowEls[r].firstChild.innerHTML =
        (rowG[r] > 0 ? '<i>' + rowG[r] + '</i>' : '') + S.row[r];
    }
    for (c = 0; c < n; c++) {
      s = 0;
      for (r = 0; r < n; r++) if (S.user[r * n + c] === 1) s++;
      colEls[c].className = 'clue' + (s === S.col[c] ? ' is-ok' : (s > S.col[c] ? ' is-over' : ''));
      colEls[c].firstChild.innerHTML =
        (colG[c] > 0 ? '<i>' + colG[c] + '</i>' : '') + S.col[c];
    }

    renderShips();
    renderFleet();

    if (!S.solved && !S.cheated && isSolved()) {
      S.solved = true;
      stopTimer();
      modalTitle.textContent = 'Rätsel ' + S.level + ' gelöst';
      modalTime.textContent = 'Zeit ' + fmt(elapsed);
      modalEl.hidden = false;
      save();
    }
  }

  /* ================= Eingabe ================= */

  function commit() {
    if (pending && pending.length) {
      history.push(pending);
      if (history.length > 100) history.shift();
      save();
    }
    pending = null;
  }

  function paint(idx, val) {
    if (S.given[idx]) return;
    if (S.user[idx] === val) return;
    pending.push({ i: idx, v: S.user[idx] });
    S.user[idx] = val;
  }

  boardEl.addEventListener('pointerdown', function (e) {
    if (!S || loading) return;
    var el = e.target.closest ? e.target.closest('.cell') : null;
    if (!el) return;
    var idx = Number(el.dataset.i);
    if (S.given[idx]) return;
    e.preventDefault();
    pending = [];
    drag = {
      anchor: idx,
      prev: S.user[idx],
      val: NEXT[S.user[idx]],
      moved: false,
      x: e.clientX, y: e.clientY
    };
    try { boardEl.setPointerCapture(e.pointerId); } catch (err) {}
  });

  boardEl.addEventListener('pointermove', function (e) {
    if (!drag) return;
    if (!drag.moved) {
      var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (Math.sqrt(dx * dx + dy * dy) < 9) return;
      drag.moved = true;
      paint(drag.anchor, drag.val);
      render();
    }
    var el = document.elementFromPoint(e.clientX, e.clientY);
    var cell = el && el.closest ? el.closest('.cell') : null;
    if (!cell) return;
    var idx = Number(cell.dataset.i);
    if (S.given[idx]) return;
    if (S.user[idx] !== drag.val) { paint(idx, drag.val); render(); }
  });

  boardEl.addEventListener('pointerup', function (e) {
    if (!drag) return;
    if (!drag.moved) paint(drag.anchor, drag.val);
    drag = null;
    commit();
    render();
    try { boardEl.releasePointerCapture(e.pointerId); } catch (err) {}
  });

  boardEl.addEventListener('pointercancel', function () {
    drag = null; pending = null; render();
  });

  document.getElementById('undo').addEventListener('click', function () {
    var last = history.pop();
    if (!last) return;
    for (var i = last.length - 1; i >= 0; i--) S.user[last[i].i] = last[i].v;
    save(); render();
  });

  document.getElementById('clear').addEventListener('click', function () {
    var bucket = [], i;
    for (i = 0; i < S.n * S.n; i++) {
      if (S.given[i]) continue;
      if (S.user[i] !== 0) { bucket.push({ i: i, v: S.user[i] }); S.user[i] = 0; }
    }
    if (!bucket.length) return;
    history.push(bucket);
    save(); render();
  });

  document.getElementById('solve').addEventListener('click', function () {
    if (!window.confirm('Ergebnis einblenden?')) return;
    var bucket = [], i, v;
    for (i = 0; i < S.n * S.n; i++) {
      if (S.given[i]) continue;
      v = S.solution[i] ? 1 : 2;
      if (S.user[i] !== v) { bucket.push({ i: i, v: S.user[i] }); S.user[i] = v; }
    }
    S.cheated = true;
    if (bucket.length) history.push(bucket);
    save(); render();
  });

  document.getElementById('new').addEventListener('click', function () { newGame(sizeEl.value, false); });
  sizeEl.addEventListener('change', function () { newGame(sizeEl.value, false); });
  document.getElementById('next').addEventListener('click', function () { newGame(sizeEl.value, true); });
  document.getElementById('close').addEventListener('click', function () { modalEl.hidden = true; });

  /* ================= Speichern ================= */

  function save() {
    if (!S) return;
    try {
      var gv = [], i;
      for (i = 0; i < S.n * S.n; i++) if (S.given[i]) gv.push(i);
      localStorage.setItem(KEY, JSON.stringify({
        n: S.n, ships: S.ships,
        solution: Array.from(S.solution),
        row: S.row, col: S.col,
        given: gv,
        user: Array.from(S.user),
        unique: S.unique,
        level: S.level, solved: S.solved, cheated: S.cheated
      }));
    } catch (err) {}
  }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return false;
      var d = JSON.parse(raw);
      if (!d || !CONFIG[String(d.n)]) return false;
      var n = d.n;
      if (!Array.isArray(d.solution) || d.solution.length !== n * n) return false;
      if (!Array.isArray(d.user) || d.user.length !== n * n) return false;

      var gven = {}, i;
      for (i = 0; i < (d.given || []).length; i++) gven[d.given[i]] = 1;

      S = {
        n: n, ships: d.ships,
        solution: Uint8Array.from(d.solution),
        row: d.row, col: d.col,
        given: gven,
        user: Uint8Array.from(d.user),
        unique: !!d.unique,
        level: d.level || 1,
        solved: !!d.solved, cheated: !!d.cheated
      };
      sizeEl.value = String(n);
      history = [];
      build();
      render();
      startTimer();
      schedulePregen(String(n));
      return true;
    } catch (err) { return false; }
  }

  if (!load()) newGame('8', false);
})();
</script>

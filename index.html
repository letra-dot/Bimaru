<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#eaf1f9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bimaru">
<title>Bimaru</title>
<style>
  *{box-sizing:border-box}
  :root{
    --bg:#eaf1f9; --card:#fff;
    --water:#d9e9f8; --water-line:#bcd6ef;
    --sea:#bdd6ee; --ship:#16324f;
    --ok:#12a150; --bad:#e5484d;
    --text:#0f2436; --muted:#5b7186;
  }
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(120% 80% at 50% 0%,#f8fcff 0%,var(--bg) 55%,#dce8f5 100%);
    color:var(--text); min-height:100dvh; overscroll-behavior:contain;
    padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 18px);
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
  }
  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px 10px}
  .bar__title{margin:0;font-size:20px;letter-spacing:.02em}
  .bar__meta{margin:3px 0 0;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .select{border:1px solid #cfdcea;background:#fff;color:var(--text);font-size:15px;font-weight:600;padding:9px 10px;border-radius:12px}
  .wrap{max-width:440px;margin:0 auto;padding:0 14px}
  .board{
    display:grid;grid-template-columns:22px repeat(var(--n,8),1fr);gap:2px;
    background:var(--card);padding:8px;border-radius:18px;
    box-shadow:0 12px 30px rgba(16,45,74,.10);touch-action:none;
  }
  .label{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
  .label--corner{font-size:0}
  .label.is-ok{color:var(--ok)}
  .label.is-over{color:var(--bad)}
  .cell{position:relative;aspect-ratio:1;border-radius:6px;background:var(--water);box-shadow:inset 0 0 0 1px var(--water-line);transition:background .08s ease}
  .cell--sea{background:var(--sea);box-shadow:inset 0 0 0 1px #a9c6e2}
  .cell--sea::after{content:"";position:absolute;left:50%;top:50%;width:5px;height:5px;border-radius:50%;background:#7395b5;transform:translate(-50%,-50%)}
  .cell--clue{background:var(--sea);box-shadow:inset 0 0 0 1px #9cbbd8}
  .cell--clue::after{content:"";position:absolute;left:50%;top:50%;width:8px;height:6px;border-radius:2px;background:#6c8fb0;transform:translate(-50%,-50%)}
  .cell--ship{background:linear-gradient(160deg,#26547c,#12304b);box-shadow:0 1px 2px rgba(9,29,46,.35),inset 0 1px 0 rgba(255,255,255,.18)}
  .cell--bad{outline:2px solid var(--bad);outline-offset:-2px}
  .fleet{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:14px}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted);background:#fff;border:1px solid #dbe7f3;border-radius:10px;padding:5px 9px;font-variant-numeric:tabular-nums}
  .chip__ship{display:inline-block;min-width:14px;text-align:center;padding:1px 5px;border-radius:4px;background:#12304b;color:#fff;font-size:11px}
  .chip--ok{border-color:#b6e6c9;background:#f1fbf5;color:#0b7a3c}
  .chip--over{border-color:#f5c2c4;background:#fff2f2;color:var(--bad)}
  .actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
  .btn{appearance:none;-webkit-appearance:none;border:1px solid #d3e0ee;background:#fff;color:var(--text);font:inherit;font-size:15px;font-weight:600;padding:13px 10px;border-radius:14px;width:100%}
  .btn:active{transform:scale(.975)}
  .btn--primary{grid-column:1 / -1;background:linear-gradient(180deg,#2b7cc4,#1b5f9e);border-color:#1b5f9e;color:#fff}
  .legend{margin:14px 2px 0;font-size:12px;line-height:1.5;color:var(--muted)}
  .win{position:fixed;inset:0;display:grid;place-items:center;padding:24px;z-index:20;background:rgba(11,32,51,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  .win[hidden]{display:none}
  .win__card{width:100%;max-width:320px;background:#fff;border-radius:22px;padding:22px;text-align:center;box-shadow:0 24px 60px rgba(8,28,45,.35)}
  .win__kicker{margin:0;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ok)}
  .win__title{margin:6px 0 16px;font-size:21px}
  .win__card .btn{grid-column:auto;margin-top:8px}
</style>
</head>
<body>

<header class="bar">
  <div>
    <h1 class="bar__title">Bimaru</h1>
    <p class="bar__meta"><span id="level">Level 1</span></p>
  </div>
  <select id="difficulty" class="select" aria-label="Schwierigkeit">
    <option value="8">8 × 8</option>
    <option value="10">10 × 10</option>
  </select>
</header>

<main class="wrap">
  <div class="board" id="board" aria-label="Spielfeld"></div>
  <div class="fleet" id="fleet" aria-label="Flotte"></div>

  <div class="actions">
    <button class="btn" id="undo" type="button">Zurück</button>
    <button class="btn" id="clear" type="button">Leeren</button>
    <button class="btn" id="solution" type="button">Lösung</button>
    <button class="btn btn--primary" id="new" type="button">Neues Rätsel</button>
  </div>

  <p class="legend">Tippen: Schiff → Wasser → leer. Ziehen: mehrere Felder malen. Schiffe dürfen sich nicht berühren, auch nicht diagonal.</p>
</main>

<div class="win" id="win" hidden>
  <div class="win__card">
    <p class="win__kicker">Geschafft</p>
    <h2 class="win__title" id="winText">Level 1 gelöst</h2>
    <button class="btn btn--primary" id="next" type="button">Nächstes Level</button>
    <button class="btn" id="close" type="button">Brett ansehen</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var CONFIG = {
    '8':  { n: 8,  ships: [3, 2, 2, 1, 1, 1], reveal: 0.30 },
    '10': { n: 10, ships: [4, 3, 3, 2, 2, 2, 1, 1, 1, 1], reveal: 0.10 }
  };
  var KEY = 'bimaru.v2';

  var boardEl = document.getElementById('board');
  var fleetEl = document.getElementById('fleet');
  var levelEl = document.getElementById('level');
  var diffEl  = document.getElementById('difficulty');
  var winEl   = document.getElementById('win');
  var winText = document.getElementById('winText');

  var S = null;
  var history = [];
  var pending = null;
  var drag = null;
  var cellEls = [], rowEls = [], colEls = [];

  function rnd(n) { return Math.floor(Math.random() * n); }

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = rnd(i + 1), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function fits(grid, n, cells) {
    var own = new Set(cells);
    for (var k = 0; k < cells.length; k++) {
      var idx = cells[k];
      var r = (idx / n) | 0, c = idx % n;
      for (var dr = -1; dr <= 1; dr++) {
        for (var dc = -1; dc <= 1; dc++) {
          var rr = r + dr, cc = c + dc;
          if (rr < 0 || cc < 0 || rr >= n || cc >= n) continue;
          var j = rr * n + cc;
          if (own.has(j)) continue;
          if (grid[j]) return false;
        }
      }
    }
    return true;
  }

  function makeSolution(n, ships) {
    var order = ships.slice().sort(function (a, b) { return b - a; });
    for (var attempt = 0; attempt < 1000; attempt++) {
      var grid = new Uint8Array(n * n), ok = true;
      for (var i = 0; i < order.length && ok; i++) {
        var len = order[i], placed = false;
        for (var t = 0; t < 600; t++) {
          var horiz = Math.random() < 0.5, r, c;
          if (horiz) { r = rnd(n); c = rnd(n - len + 1); }
          else { r = rnd(n - len + 1); c = rnd(n); }
          var cells = [];
          for (var k = 0; k < len; k++) cells.push(horiz ? r * n + c + k : (r + k) * n + c);
          if (fits(grid, n, cells)) {
            for (var m = 0; m < cells.length; m++) grid[cells[m]] = 1;
            placed = true;
            break;
          }
        }
        if (!placed) ok = false;
      }
      if (ok) return grid;
    }
    return null;
  }

  function components() {
    var n = S.n, u = S.user, seen = new Uint8Array(n * n), out = [];
    for (var i = 0; i < n * n; i++) {
      if (u[i] !== 1 || seen[i]) continue;
      var stack = [i], cells = [];
      seen[i] = 1;
      while (stack.length) {
        var j = stack.pop();
        cells.push(j);
        var r = (j / n) | 0, c = j % n;
        var nb = [[1, 0], [-1, 0], [0, 1], [0, -1]];
        for (var k = 0; k < 4; k++) {
          var rr = r + nb[k][0], cc = c + nb[k][1];
          if (rr < 0 || cc < 0 || rr >= n || cc >= n) continue;
          var q = rr * n + cc;
          if (u[q] === 1 && !seen[q]) { seen[q] = 1; stack.push(q); }
        }
      }
      var rows = new Set(), cols = new Set();
      for (var z = 0; z < cells.length; z++) {
        rows.add((cells[z] / n) | 0);
        cols.add(cells[z] % n);
      }
      out.push({ len: cells.length, cells: cells, straight: rows.size === 1 || cols.size === 1 });
    }
    return out;
  }

  function computeBad() {
    var n = S.n, u = S.user, bad = new Set(), r, c;
    for (r = 0; r < n; r++) {
      for (c = 0; c < n; c++) {
        if (u[r * n + c] !== 1) continue;
        if (r + 1 < n && c + 1 < n && u[(r + 1) * n + c + 1] === 1) {
          bad.add(r * n + c); bad.add((r + 1) * n + c + 1);
        }
        if (r + 1 < n && c - 1 >= 0 && u[(r + 1) * n + c - 1] === 1) {
          bad.add(r * n + c); bad.add((r + 1) * n + c - 1);
        }
      }
    }
    var comps = components();
    for (var i = 0; i < comps.length; i++) {
      if (!comps[i].straight) {
        for (var k = 0; k < comps[i].cells.length; k++) bad.add(comps[i].cells[k]);
      }
    }
    return bad;
  }

  function checkWin() {
    var n = S.n, u = S.user, r, c, s, i;
    for (r = 0; r < n; r++) {
      s = 0;
      for (c = 0; c < n; c++) if (u[r * n + c] === 1) s++;
      if (s !== S.row[r]) return false;
    }
    for (c = 0; c < n; c++) {
      s = 0;
      for (r = 0; r < n; r++) if (u[r * n + c] === 1) s++;
      if (s !== S.col[c]) return false;
    }
    var comps = components(), req = {}, got = {};
    for (i = 0; i < comps.length; i++) {
      if (!comps[i].straight) return false;
      got[comps[i].len] = (got[comps[i].len] || 0) + 1;
    }
    for (i = 0; i < S.ships.length; i++) req[S.ships[i]] = (req[S.ships[i]] || 0) + 1;
    for (var k in req) if (got[k] !== req[k]) return false;
    for (var g in got) if (!req[g]) return false;
    return computeBad().size === 0;
  }

  function newGame(nKey, keepLevel) {
    var cfg = CONFIG[nKey];
    var grid = makeSolution(cfg.n, cfg.ships);
    if (!grid) return;
    var n = cfg.n, row = new Array(n).fill(0), col = new Array(n).fill(0), i;
    for (i = 0; i < n * n; i++) if (grid[i]) { row[(i / n) | 0]++; col[i % n]++; }

    var sea = [];
    for (i = 0; i < n * n; i++) if (!grid[i]) sea.push(i);
    shuffle(sea);
    var revealed = new Set(sea.slice(0, Math.round(sea.length * cfg.reveal)));
    var user = new Uint8Array(n * n);
    revealed.forEach(function (idx) { user[idx] = 2; });

    var nextLevel = (keepLevel && S) ? S.level + 1 : 1;
    S = {
      n: n,
      ships: cfg.ships.slice().sort(function (a, b) { return b - a; }),
      solution: grid, row: row, col: col,
      revealed: revealed, user: user,
      level: nextLevel, cheated: false, won: false
    };
    history = []; pending = null; drag = null;
    winEl.hidden = true;
    buildBoard();
    update();
    save();
  }

  function buildBoard() {
    var n = S.n, r, c;
    boardEl.style.setProperty('--n', n);
    boardEl.innerHTML = '';
    cellEls = []; rowEls = []; colEls = [];

    var corner = document.createElement('div');
    corner.className = 'label label--corner';
    boardEl.appendChild(corner);

    for (c = 0; c < n; c++) {
      var cl = document.createElement('div');
      cl.className = 'label label--col';
      cl.textContent = S.col[c];
      boardEl.appendChild(cl);
      colEls.push(cl);
    }

    for (r = 0; r < n; r++) {
      var rl = document.createElement('div');
      rl.className = 'label label--row';
      rl.textContent = S.row[r];
      boardEl.appendChild(rl);
      rowEls.push(rl);

      for (c = 0; c < n; c++) {
        var cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.i = String(r * n + c);
        boardEl.appendChild(cell);
        cellEls[r * n + c] = cell;
      }
    }
  }

  function renderFleet() {
    var comps = components(), placed = {}, req = {}, i;
    for (i = 0; i < comps.length; i++) {
      if (comps[i].straight) placed[comps[i].len] = (placed[comps[i].len] || 0) + 1;
    }
    for (i = 0; i < S.ships.length; i++) req[S.ships[i]] = (req[S.ships[i]] || 0) + 1;

    var lens = Object.keys(req).map(Number).sort(function (a, b) { return b - a; });
    var html = '';
    for (i = 0; i < lens.length; i++) {
      var l = lens[i], p = placed[l] || 0, rq = req[l];
      var cls = p === rq ? 'chip chip--ok' : (p > rq ? 'chip chip--over' : 'chip');
      html += '<span class="' + cls + '"><span class="chip__ship">' + l + '</span>' + p + '/' + rq + '</span>';
    }
    fleetEl.innerHTML = html;
  }

  function update() {
    var n = S.n, bad = computeBad(), i, r, c, s;

    for (i = 0; i < n * n; i++) {
      var cls = 'cell';
      if (S.revealed.has(i)) cls += ' cell--clue';
      else if (S.user[i] === 1) cls += ' cell--ship';
      else if (S.user[i] === 2) cls += ' cell--sea';
      if (bad.has(i)) cls += ' cell--bad';
      cellEls[i].className = cls;
    }

    for (r = 0; r < n; r++) {
      s = 0;
      for (c = 0; c < n; c++) if (S.user[r * n + c] === 1) s++;
      rowEls[r].textContent = S.row[r];
      rowEls[r].className = 'label label--row' + (s === S.row[r] ? ' is-ok' : (s > S.row[r] ? ' is-over' : ''));
    }
    for (c = 0; c < n; c++) {
      s = 0;
      for (r = 0; r < n; r++) if (S.user[r * n + c] === 1) s++;
      colEls[c].textContent = S.col[c];
      colEls[c].className = 'label label--col' + (s === S.col[c] ? ' is-ok' : (s > S.col[c] ? ' is-over' : ''));
    }

    renderFleet();
    levelEl.textContent = 'Level ' + S.level + ' · ' + n + ' × ' + n;

    if (!S.won && !S.cheated && checkWin()) {
      S.won = true;
      winText.textContent = 'Level ' + S.level + ' gelöst';
      winEl.hidden = false;
      save();
    }
  }

  function commit() {
    if (pending && pending.length) {
      history.push(pending);
      if (history.length > 80) history.shift();
      save();
    }
    pending = null;
  }

  function setCell(idx, val) {
    if (S.revealed.has(idx)) return;
    if (S.user[idx] === val) return;
    pending.push({ idx: idx, prev: S.user[idx] });
    S.user[idx] = val;
  }

  boardEl.addEventListener('pointerdown', function (e) {
    var cell = e.target.closest('.cell');
    if (!cell || !S) return;
    var idx = Number(cell.dataset.i);
    if (S.revealed.has(idx)) return;
    e.preventDefault();
    pending = [];
    drag = {
      anchor: idx, prev: S.user[idx],
      val: S.user[idx] === 2 ? 2 : 1,
      moved: false, pt: { x: e.clientX, y: e.clientY }
    };
    try { boardEl.setPointerCapture(e.pointerId); } catch (err) {}
  });

  boardEl.addEventListener('pointermove', function (e) {
    if (!drag) return;
    if (!drag.moved) {
      var dx = e.clientX - drag.pt.x, dy = e.clientY - drag.pt.y;
      if (Math.sqrt(dx * dx + dy * dy) < 8) return;
      drag.moved = true;
      setCell(drag.anchor, drag.val);
      update();
    }
    var el = document.elementFromPoint(e.clientX, e.clientY);
    var cell = el && el.closest ? el.closest('.cell') : null;
    if (!cell) return;
    var idx = Number(cell.dataset.i);
    if (S.revealed.has(idx)) return;
    if (S.user[idx] !== drag.val) { setCell(idx, drag.val); update(); }
  });

  boardEl.addEventListener('pointerup', function (e) {
    if (!drag) return;
    if (!drag.moved) setCell(drag.anchor, (drag.prev + 1) % 3);
    drag = null;
    commit();
    update();
    try { boardEl.releasePointerCapture(e.pointerId); } catch (err) {}
  });

  boardEl.addEventListener('pointercancel', function () {
    drag = null; pending = null; update();
  });

  document.getElementById('undo').addEventListener('click', function () {
    var last = history.pop();
    if (!last) return;
    for (var i = last.length - 1; i >= 0; i--) S.user[last[i].idx] = last[i].prev;
    save(); update();
  });

  document.getElementById('clear').addEventListener('click', function () {
    var bucket = [];
    for (var i = 0; i < S.n * S.n; i++) {
      if (S.revealed.has(i)) continue;
      if (S.user[i] !== 0) { bucket.push({ idx: i, prev: S.user[i] }); S.user[i] = 0; }
    }
    if (!bucket.length) return;
    history.push(bucket);
    save(); update();
  });

  document.getElementById('solution').addEventListener('click', function () {
    if (!window.confirm('Lösung einblenden? Das Level zählt dann nicht.')) return;
    var bucket = [];
    for (var i = 0; i < S.n * S.n; i++) {
      if (S.revealed.has(i)) continue;
      var v = S.solution[i] ? 1 : 2;
      if (S.user[i] !== v) { bucket.push({ idx: i, prev: S.user[i] }); S.user[i] = v; }
    }
    S.cheated = true;
    if (bucket.length) history.push(bucket);
    save(); update();
  });

  document.getElementById('new').addEventListener('click', function () {
    newGame(diffEl.value, false);
  });

  diffEl.addEventListener('change', function () {
    newGame(diffEl.value, false);
  });

  document.getElementById('next').addEventListener('click', function () {
    newGame(diffEl.value, true);
  });

  document.getElementById('close').addEventListener('click', function () {
    winEl.hidden = true;
  });

  function save() {
    if (!S) return;
    try {
      localStorage.setItem(KEY, JSON.stringify({
        n: S.n, ships: S.ships,
        solution: Array.from(S.solution),
        row: S.row, col: S.col,
        revealed: Array.from(S.revealed),
        user: Array.from(S.user),
        level: S.level, cheated: S.cheated, won: S.won
      }));
    } catch (err) {}
  }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return false;
      var d = JSON.parse(raw);
      if (!d || !CONFIG[String(d.n)]) return false;
      var n = d.n;
      if (!Array.isArray(d.solution) || d.solution.length !== n * n) return false;
      if (!Array.isArray(d.user) || d.user.length !== n * n) return false;
      S = {
        n: n, ships: d.ships,
        solution: Uint8Array.from(d.solution),
        row: d.row, col: d.col,
        revealed: new Set(d.revealed),
        user: Uint8Array.from(d.user),
        level: d.level || 1,
        cheated: !!d.cheated, won: !!d.won
      };
      diffEl.value = String(n);
      history = [];
      buildBoard();
      update();
      return true;
    } catch (err) { return false; }
  }

  if (!load()) newGame('8', false);
})();
</script>
</body>
</html>
